<title>Impostor a Bordo</title>
<style>
body{margin:0;font-family:system-ui;background:radial-gradient(#1b2340,#05070f);color:#eef;min-height:100vh}
h1{text-align:center;margin:14px;letter-spacing:2px}.wrap{display:grid;grid-template-columns:1fr 340px;gap:14px;padding:14px;max-width:1150px;margin:auto}
.card{background:#ffffff12;border:1px solid #ffffff22;border-radius:16px;padding:14px;backdrop-filter:blur(8px)}
#map{position:relative;min-width:0}
#map svg.plano{width:100%;height:auto;display:block;border-radius:18px;box-shadow:0 10px 28px #0005;user-select:none;background:#f4eadc}
@media (max-width:860px){

  .wrap>.card:first-child{min-width:0}

}
#map .hit.can{cursor:pointer}
#map .hit.can:hover{fill:#1f9d4a24}
#map .venthot{cursor:pointer}
@keyframes ventpulse{50%{opacity:.4}}
#map .venthot .ring{animation:ventpulse 1.15s ease-in-out infinite}
@keyframes steam{0%,100%{opacity:.2}50%{opacity:.85}}
#map .steam{animation:steam 1.7s ease-in-out infinite}
@keyframes youpulse{50%{stroke-opacity:.55}}
#map .you{animation:youpulse 1.8s ease-in-out infinite}
@keyframes popin{from{opacity:0}to{opacity:1}}
#map .pop{animation:popin .35s ease}
@media (prefers-reduced-motion:reduce){
  #map .venthot .ring,#map .steam,#map .you,#map .pop{animation:none}
}
button{background:#4a6cff;color:#fff;border:0;border-radius:10px;padding:8px 12px;margin:3px;cursor:pointer;font-weight:600}button.red{background:#e0435a}button.gray{background:#556}
#log{height:240px;overflow:auto;font-size:13px;line-height:1.45}input{padding:8px;border-radius:8px;border:0;width:140px}
.bar{height:10px;background:#333;border-radius:6px;overflow:hidden}.bar div{height:100%;background:#5fe08a}
.big{font-size:22px;text-align:center;padding:10px}

let me=JSON.parse(localStorage.ib||"{}"),S=null,travelHint=null;
async function post(o){
  const act=o&&o.action;
  if(act==="move"||act==="vent")travelHint=act;
  try{
    const r=await (await fetch("/",{method:"POST",body:JSON.stringify(Object.assign({name:me.name,token:me.token},o))})).json();
    if(r.error)alert(r.error);
    if(r.token){me={name:o.name,token:r.token};localStorage.ib=JSON.stringify(me)}
    await poll();
    return r;
  }finally{if(act==="move"||act==="vent")travelHint=null}
}
async function poll(){S=await (await fetch(`/state?name=${encodeURIComponent(me.name||"")}&token=${me.token||""}`)).json();draw()}

  {a:"Terraza",b:"Cocina",pts:[[918,214],[918,292]],ga:[892,150],gb:[900,312],lx:948,ly:252}

const HALL_LABELS=[{x:470,y:48,t:"cubierta"},{x:640,y:334,t:"pasillo",rot:-90},{x:640,y:706,t:"pasillo"},{x:490,y:820,t:"pasillo inferior"}];
function esc(s){return String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]))}
function shade(hex,d){const n=parseInt(hex.slice(1),16);const c=v=>Math.max(0,Math.min(255,v+d));return"#"+[c(n>>16),c((n>>8)&255),c(n&255)].map(v=>v.toString(16).padStart(2,"0")).join("")}
function mute(hex){const n=parseInt(hex.slice(1),16);const m=c=>Math.round(c*0.38+132);return"#"+[m(n>>16),m((n>>8)&255),m(n&255)].map(v=>v.toString(16).padStart(2,"0")).join("")}
function crewBean(color,ghost){const dark=shade(color,-52);const vis=ghost?"#e4dff6":"#c9f6ff";return`<g opacity="${ghost?.5:1}"><ellipse cx="0" cy="14" rx="9" ry="2.4" fill="#000" opacity=".16"/><rect x="-11.2" y="-5" width="5.6" height="11" rx="2.6" fill="${dark}" stroke="#241c16" stroke-width=".6"/><rect x="-7" y="-12" width="14" height="22" rx="7" fill="${color}" stroke="#241c16" stroke-width=".7"/><rect x="-6.2" y="8" width="5" height="5.2" rx="2" fill="${dark}" stroke="#241c16" stroke-width=".45"/><rect x="1.3" y="8" width="5" height="5.2" rx="2" fill="${dark}" stroke="#241c16" stroke-width=".45"/><rect x="-1.2" y="-7" width="11" height="8" rx="3.2" fill="${vis}" stroke="#241c16" stroke-width=".65"/><ellipse cx="5.2" cy="-4.6" rx="2" ry="1" fill="#fff" opacity=".75"/></g>`}
function bodyBean(color){const dark=shade(color,-36);return`<g><ellipse cx="1" cy="9" rx="13" ry="3" fill="#000" opacity=".16"/><rect x="-17" y="-4" width="6" height="9" rx="2.4" fill="${dark}" stroke="#241c16" stroke-width=".6"/><rect x="-13" y="-8" width="28" height="15" rx="7.5" fill="${color}" stroke="#241c16" stroke-width=".75"/><rect x="-9" y="5" width="5" height="4.2" rx="1.6" fill="${dark}" stroke="#241c16" stroke-width=".4"/><rect x="-2" y="5" width="5" height="4.2" rx="1.6" fill="${dark}" stroke="#241c16" stroke-width=".4"/><rect x="4" y="-12" width="13" height="8" rx="3.2" fill="#4e4944" stroke="#241c16" stroke-width=".65"/><path d="M7.2-10.2l6.2 4.8M13.4-10.2l-6.2 4.8" stroke="#f4eadc" stroke-width="1.15"/></g>`}
function nameTag(x,y,text,fs,anchor,sub){const fs2=Math.max(8,fs-2);const w=Math.max(String(text).length*fs*0.58,(sub?String(sub).length*fs2*0.58:0))+12;const h=sub?fs+fs2+7:fs+6;const left=anchor==="middle"?x-w/2:x;const tx=anchor==="middle"?x:x+6;const ta=anchor==="middle"?"middle":"start";return`<g pointer-events="none"><rect x="${left.toFixed(1)}" y="${(y-fs).toFixed(1)}" width="${w.toFixed(1)}" height="${h}" rx="4" fill="#fffaf3" fill-opacity=".94" stroke="#e4d2b4" stroke-width=".6"/><text x="${tx.toFixed(1)}" y="${y}" text-anchor="${ta}" font-size="${fs}" font-weight="700" fill="#3f2a1c" font-family="system-ui,sans-serif">${esc(text)}</text>${sub?`<text x="${tx.toFixed(1)}" y="${y+fs2+1}" text-anchor="${ta}" font-size="${fs2}" font-weight="700" fill="#8a4032" font-family="system-ui,sans-serif">${esc(sub)}</text>`:""}</g>`}
function figure(it,cl,x,y,fs,sc,mode,pop){const raw=cl[it.name]||"#c45cff";const color=it.body?mute(raw):raw;const bean=it.body?bodyBean(color):crewBean(color,!!it.ghost);const tagX=mode==="right"?16:0;const tagY=mode==="right"?4:24;const anchor=mode==="right"?"start":"middle";const you=!it.body&&it.self?`<text x="0" y="-20" text-anchor="middle" font-size="11" font-weight="700" fill="#8a5a10" stroke="#fff6e4" stroke-width="3" paint-order="stroke" font-family="system-ui,sans-serif">tú</text>`:"";const ring=!it.body&&it.self?`<ellipse cx="0" cy="14" rx="13" ry="3.6" fill="none" stroke="#e2a20e" stroke-width="1.6"/>`:"";return`<g class="${pop||""}" transform="translate(${x.toFixed(1)},${y.toFixed(1)})" pointer-events="none">${ring}<g transform="scale(${sc})">${bean}</g>${you}${nameTag(tagX,tagY,it.name,fs,anchor,it.body?"cuerpo":"")}</g>`}
function peopleIn(room,M){if(!M||M.room!==room)return[];const list=[{name:M.name,self:true,ghost:!M.alive}];for(const n of M.here||[])list.push({name:n});for(const n of M.bodies||[])list.push({name:n,body:true});return list}
function layout(room,items){const r=ROOMS[room];if(!r||!items.length)return[];const n=items.length;const wide=!!r.wide;const maxRow=r.maxRow||4;if(n<=maxRow||wide){const gap=n<=1?0:Math.min(r.gap||34,(r.span||120)/Math.max(1,n-1));const total=gap*(n-1);const fs=n>=5?10:(r.fs||12);return items.map((it,i)=>({it,x:r.stand[0]-total/2+i*gap,y:r.stand[1],fs,sc:it.body?(r.sc||1)*.95:(r.sc||1),mode:"mid"}))}const row=24;const top=r.stand[1]-((n-1)*row)/2;return items.map((it,i)=>({it,x:r.stand[0]-24,y:top+i*row,fs:11,sc:Math.min(r.sc||1,.9),mode:"right"}))}
function dist(a,b){return Math.hypot(a[0]-b[0],a[1]-b[1])}
function clean(pts){const out=[];for(const p of pts){const q=[p[0],p[1]];const last=out[out.length-1];if(!last||dist(last,q)>0.8)out.push(q)}return out.length?out:[[0,0]]}
function pointAt(pts,t){const seg=[];let total=0;for(let i=1;i<pts.length;i++){const d=dist(pts[i-1],pts[i]);seg.push(d);total+=d}if(total<0.001)return{x:pts[0][0],y:pts[0][1]};let need=Math.max(0,Math.min(1,t))*total;for(let i=1;i<pts.length;i++){const d=seg[i-1];if(need<=d||i===pts.length-1){const k=d?Math.max(0,Math.min(1,need/d)):0;return{x:pts[i-1][0]+(pts[i][0]-pts[i-1][0])*k,y:pts[i-1][1]+(pts[i][1]-pts[i-1][1])*k}}need-=d}const last=pts[pts.length-1];return{x:last[0],y:last[1]}}
function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function faceSign(pts,t){const a=pointAt(pts,Math.max(0,t-.02));const b=pointAt(pts,Math.min(1,t+.02));return b.x<a.x-.4?-1:1}
function route(a,b,start,end){const adj={};for(const e of LINKS){(adj[e.a]||(adj[e.a]=[])).push(e);(adj[e.b]||(adj[e.b]=[])).push(e)}const prev={[a]:null};const q=[a];while(q.length){const n=q.shift();if(n===b)break;for(const e of adj[n]||[]){const m=e.a===n?e.b:e.a;if(!(m in prev)){prev[m]={via:n,e};q.push(m)}}}const pts=[start];if(!(b in prev)){pts.push(end);return clean(pts)}const edges=[];let cur=b;while(prev[cur]){edges.push(prev[cur]);cur=prev[cur].via}edges.reverse();let at=a;for(const step of edges){const e=step.e;const forward=e.a===at;const line=forward?e.pts:[...e.pts].reverse();pts.push(...line);at=forward?e.b:e.a}pts.push(end);return clean(pts)}
function isVent(a,b){return VENT_DRAW.some(v=>(v.a===a&&v.b===b)||(v.a===b&&v.b===a))}
function ventRoute(a,b,start,end){const v=VENT_DRAW.find(v=>(v.a===a&&v.b===b)||(v.a===b&&v.b===a));if(!v)return route(a,b,start,end);const line=v.a===a?v.pts:[...v.pts].reverse();return clean([start,...line,end])}
function travelDur(pts){let L=0;for(let i=1;i<pts.length;i++)L+=dist(pts[i-1],pts[i]);return Math.max(520,Math.min(1500,L*1.25))}
function slotOf(M){const laid=layout(M.room,peopleIn(M.room,M));const meSlot=laid.find(p=>p.it.self&&!p.it.body);return meSlot?[meSlot.x,meSlot.y]:(ROOMS[M.room]?ROOMS[M.room].stand.slice():[0,0])}
function syncWalk(M){if(!M){seenRoom=null;selfAnchor=null;walk=null;return}const room=M.room;if(seenRoom&&seenRoom!==room){const start=(walk&&walk.live)||selfAnchor||(ROOMS[seenRoom]?ROOMS[seenRoom].stand.slice():[0,0]);const end=slotOf(M);if(!reduceMotion){const via=travelHint==="vent"&&isVent(seenRoom,room)?"vent":"walk";const pts=via==="vent"?ventRoute(seenRoom,room,start,end):route(seenRoom,room,start,end);walk={name:M.name,from:seenRoom,to:room,pts,t0:performance.now(),dur:travelDur(pts),live:start.slice()};ensureLoop()}else walk=null}seenRoom=room}
function ensureLoop(){if(walkRAF||!walk)return;const step=now=>{if(!walk){walkRAF=0;return}const g=document.getElementById("walker");const t=Math.min(1,(now-walk.t0)/walk.dur);const p=pointAt(walk.pts,ease(t));walk.live=[p.x,p.y];if(g){const bob=Math.sin(t*Math.PI*7)*1.7;g.setAttribute("transform",`translate(${p.x.toFixed(1)},${(p.y+bob).toFixed(1)})`);const face=g.querySelector(".face");if(face){const dir=faceSign(walk.pts,t);face.setAttribute("transform",`scale(${dir},1)`)}}if(t>=1){walk=null;walkRAF=0;paint();return}walkRAF=requestAnimationFrame(step)};walkRAF=requestAnimationFrame(step)}
function extendEnds(pts,amt){if(pts.length<2)return pts.map(p=>p.slice());const out=pts.map(p=>p.slice());function nudge(i,j){const dx=pts[j][0]-pts[i][0],dy=pts[j][1]-pts[i][1];const L=Math.hypot(dx,dy)||1;out[i][0]=pts[i][0]-dx/L*amt;out[i][1]=pts[i][1]-dy/L*amt}nudge(0,1);nudge(pts.length-1,pts.length-2);return out}
function poly(pts){return pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")}
function roomAttrs(r){if(r.circle){const[cx,cy,rad]=r.circle;return{tag:"ellipse",attrs:`cx="${cx}" cy="${cy}" rx="${rad}" ry="${rad}"`}}return{tag:"path",attrs:`d="${r.d}"`}}
function roomEl(r,attrs,inner){const s=roomAttrs(r);return`<${s.tag} ${attrs} ${s.attrs}>${inner||""}</${s.tag}>`}
function iconFor(name){
  if(name==="Tostadora")return`<g pointer-events="none"><rect x="-22" y="-12" width="44" height="26" rx="8" fill="#5c4033"/><rect x="-16" y="-7" width="14" height="16" rx="3" fill="#2a211c"/><rect x="2" y="-7" width="14" height="16" rx="3" fill="#2a211c"/><circle cx="16" cy="8" r="2.2" fill="#e6b15a"/><ellipse cx="-10" cy="20" rx="4" ry="2.3" fill="#3a2418"/><ellipse cx="0" cy="22" rx="4" ry="2.3" fill="#4a3024"/><ellipse cx="10" cy="19" rx="3.2" ry="2" fill="#3a2418"/></g>`;
  if(name==="Barra"){let cups="";for(let i=0;i<6;i++){const x=338+i*58;if(Math.abs(x-500)<30)continue;cups+=`<g transform="translate(${x},130)"><circle r="7" fill="#fffaf3" stroke="#5c4033" stroke-width="1.2"/><path d="M6.2-.2h3.2a2.5 2.5 0 0 1 0 5H6.2" fill="none" stroke="#5c4033" stroke-width="1.1"/><ellipse cy="-1.4" rx="3" ry="1.2" fill="#6b3e2a"/></g>`}return`<g pointer-events="none"><rect x="320" y="140" width="360" height="13" rx="4" fill="#7a4e32"/><rect x="320" y="150" width="360" height="5" fill="#c9a36a"/>${cups}</g>`}
  if(name==="Caja")return`<g pointer-events="none"><rect x="-18" y="-2" width="36" height="22" rx="3" fill="#6b4e38"/><rect x="-14" y="-14" width="22" height="12" rx="2" fill="#d7efe4" stroke="#6b4e38"/><rect x="10" y="-12" width="6" height="8" rx="1" fill="#e6b15a"/><rect x="-12" y="6" width="24" height="4" rx="1" fill="#c9a36a"/><circle cx="-8" cy="14" r="1.4" fill="#2a211c"/><circle cy="14" r="1.4" fill="#2a211c"/><circle cx="8" cy="14" r="1.4" fill="#2a211c"/></g>`;
  if(name==="Bodega de granos")return[0,1,2,3].map(i=>{const x=-117+i*78;return`<g pointer-events="none" transform="translate(${x},0)"><ellipse cy="6" rx="14" ry="12" fill="#e0b56a" stroke="#6b4e38" stroke-width="1.2"/><path d="M-8-2c1-10 15-10 16 0" fill="#c9964c" stroke="#6b4e38" stroke-width="1.1"/><ellipse cy="-2" rx="3.2" ry="1.7" fill="#5c4033"/></g>`}).join("");
  if(name==="Cuarto de máquinas"){const teeth=Array.from({length:8},(_,i)=>{const a=i*Math.PI/4;return `<line x1="${(Math.cos(a)*9).toFixed(1)}" y1="${(Math.sin(a)*9).toFixed(1)}" x2="${(Math.cos(a)*14).toFixed(1)}" y2="${(Math.sin(a)*14).toFixed(1)}" stroke="#4e463f" stroke-width="3.4" stroke-linecap="round"/>`}).join("");return `<g pointer-events="none">${teeth}<circle r="8" fill="#6d655c" stroke="#3a322c"/><circle r="3" fill="#2a211c"/><path d="M16-4c8-8 16 2 8 8" fill="none" stroke="#e6b15a" stroke-width="1.4" stroke-linecap="round"/><circle cx="-16" cy="10" r="2.1" fill="#e0435a"/><circle cx="-9" cy="14" r="2.1" fill="#5fe08a"/></g>`}
  if(name==="Cámaras")return`<g pointer-events="none"><rect x="-28" y="-14" width="24" height="16" rx="2" fill="#243038"/><rect x="4" y="-14" width="24" height="16" rx="2" fill="#243038"/><rect x="-25" y="-11" width="18" height="10" fill="#8fd0c8"/><rect x="7" y="-11" width="18" height="10" fill="#8fd0c8"/><path d="M-16 2v6M16 2v6M-24 8h48" stroke="#5c4033" stroke-width="1.4"/><circle cx="22" cy="-18" r="3.2" fill="#3a322c"/><circle cx="22" cy="-18" r="1.3" fill="#e0435a"/></g>`;
  if(name==="Terraza")return`<g pointer-events="none"><circle cy="2" r="11" fill="#c4a06a" stroke="#6b4e38" stroke-width="1.2"/><circle cy="2" r="3.6" fill="#f4eadc"/><circle cx="-18" cy="6" r="4.6" fill="#6b4e38"/><circle cx="18" cy="6" r="4.6" fill="#6b4e38"/><rect x="-34" y="-6" width="7" height="14" rx="2" fill="#7a4e32"/><circle cx="-30.5" cy="-12" r="7" fill="#6a8f4e"/></g>`;
  if(name==="Cocina")return`<g pointer-events="none"><rect x="-24" y="-14" width="48" height="26" rx="4" fill="#6b4e38"/><circle cx="-10" cy="-4" r="6" fill="none" stroke="#2a211c" stroke-width="1.6"/><circle cx="10" cy="-4" r="6" fill="none" stroke="#2a211c" stroke-width="1.6"/><circle cx="-10" cy="-4" r="1.5" fill="#e6b15a"/><circle cx="10" cy="-4" r="1.5" fill="#e6b15a"/><ellipse cy="16" rx="8" ry="4.2" fill="#f3d2a2" stroke="#c48a4a"/><path d="M-4 15h8" stroke="#e7b56a" stroke-width="1.2"/></g>`;
  if(name==="Molinos")return`<g pointer-events="none"><circle cx="-11" r="11" fill="#efe2cc" stroke="#6b4e38" stroke-width="1.4"/><circle cx="-11" r="2.3" fill="#6b4e38"/><path d="M-11-8v16M-19 0h16" stroke="#6b4e38" stroke-width=".7" opacity=".5"/><circle cx="11" r="11" fill="#efe2cc" stroke="#6b4e38" stroke-width="1.4"/><circle cx="11" r="2.3" fill="#6b4e38"/><path d="M11-8v16M3 0h16" stroke="#6b4e38" stroke-width=".7" opacity=".5"/></g>`;
  return`<g pointer-events="none"><rect x="-10" y="2" width="20" height="20" rx="8" fill="#c47a45" stroke="#6b4e38"/><rect x="-7" y="-6" width="14" height="10" rx="2" fill="#a8643a"/><path class="steam" d="M-3-10c2-6 2-6 0-11" fill="none" stroke="#fffaf3" stroke-width="1.4" stroke-linecap="round"/><path class="steam" d="M4-8c2-6 3-5 1-12" fill="none" stroke="#fffaf3" stroke-width="1.4" stroke-linecap="round"/><circle cy="12" r="2.2" fill="#e6b15a"/></g>`;
}
function roomLabel(r){const fs=r.lfs||16;return r.lines.map((ln,i)=>`<text x="${r.label[0]}" y="${r.label[1]+i*(fs+1)}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="#3f2a1c" stroke="#fbf6ee" stroke-width="4" paint-order="stroke" stroke-linejoin="round" font-family="system-ui,sans-serif">${esc(ln)}</text>`).join("")}
function taskBadge(x,y){return`<g pointer-events="none" transform="translate(${x},${y})"><title>Tarea pendiente</title><rect width="16" height="18" rx="2" fill="#fffaf3" stroke="#5c4033"/><rect x="4" y="-2" width="8" height="4" rx="1" fill="#e7d3b0" stroke="#5c4033" stroke-width=".8"/><path d="M3.5 7h9M3.5 10.5h9M3.5 14h6" stroke="#1f9d4a" stroke-width="1.2"/></g>`}
function grate(x,y,hot){return`<g class="${hot?"venthot":"vent"}" transform="translate(${x},${y})" ${hot?`data-vent="1"`:""} pointer-events="${hot?"all":"none"}"><title>${hot?"Usar ventila":"Ventila"}</title>${hot?`<rect class="ring" x="-8" y="-8" width="48" height="36" rx="8" fill="#f0b429" fill-opacity=".22" stroke="#e2a20e" stroke-width="2"/>`:""}<rect width="32" height="20" rx="3" fill="#3e3128" stroke="#c4a574" stroke-width="1.5"/><path d="M3 5h26M3 10h26M3 15h26" stroke="#f0e2d0" stroke-width="1.7"/></g>`}
function legend(){const bean=crewBean("#e0435a",false);const dead=bodyBean("#b7aea6");return`<g transform="translate(16,872)" font-family="system-ui,sans-serif" font-size="14" fill="#5c4033"><rect width="988" height="44" rx="12" fill="#fffaf3" stroke="#e0d0b8"/><text x="16" y="28" font-weight="800" fill="#4a3428">Cubierta</text><rect x="108" y="14" width="20" height="16" rx="4" fill="#fff6d2" stroke="#f0b429" stroke-width="3"/><text x="136" y="28">Tu sala</text><rect x="214" y="14" width="20" height="16" rx="4" fill="#f7f1e6" stroke="#1f9d4a" stroke-width="3"/><text x="242" y="28">Puedes entrar</text><g transform="translate(390,12)">${grate(0,0,false)}</g><text x="430" y="28">Ventila</text><g transform="translate(512,12)">${taskBadge(0,0)}</g><text x="536" y="28">Tarea</text><g transform="translate(620,30) scale(.7)">${bean}</g><text x="642" y="28">Jugador</text><g transform="translate(750,28) scale(.62)">${dead}</g><text x="778" y="28">Cuerpo</text></g>`}
function auditMap(){if(!S||!S.map)return;const have=new Set(LINKS.map(e=>[e.a,e.b].sort().join("|")));for(const[a,bs]of Object.entries(S.map)){if(!ROOMS[a])console.warn("Sala sin dibujar",a);for(const b of bs){const k=[a,b].sort().join("|");if(!have.has(k))console.warn("Pasillo faltante",a,"→",b)}}}
function paint(){const M=S.me;const cl=lastCl;const here=M&&M.room;const exits=new Set(M&&S.phase==="play"?M.exits:[]);const tasks=new Set((M&&M.tasks)||[]);const canVent=!!(M&&M.alive&&M.vent&&S.phase==="play");auditMap();const names=new Set();const p=[];
p.push(`<svg class="plano" viewBox="0 0 1020 930" role="group" aria-label="Plano de la cafetería">`);
p.push(`<defs><pattern id="plating" width="32" height="32" patternUnits="userSpaceOnUse"><rect width="32" height="32" fill="#6e4b36"/><path d="M0 32H32M32 0V32" stroke="#5a3a28" stroke-width="1.1"/><circle cx="1.4" cy="1.4" r="1.15" fill="#8d6a52"/></pattern><filter id="you" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="3.4" flood-color="#f0b429" flood-opacity=".85"/></filter></defs>`);
p.push(`<rect width="1020" height="930" fill="#f4eadc"/>`);
p.push(`<rect x="12" y="12" width="996" height="846" rx="36" fill="url(#plating)" stroke="#2a1b14" stroke-width="8"/>`);
p.push(`<rect x="26" y="26" width="968" height="818" rx="28" fill="none" stroke="#a07858" stroke-width="1.4" opacity=".85"/>`);
for(const name in ROOMS){const r=ROOMS[name];const fill=name===here?"#fff6d2":r.floor;p.push(roomEl(r,`fill="${fill}" stroke="#5a3b2c" stroke-width="5" stroke-linejoin="round"`));if(name===here)p.push(roomEl(r,`class="you" fill="none" stroke="#f0b429" stroke-width="6" filter="url(#you)"`));else if(exits.has(name))p.push(roomEl(r,`fill="none" stroke="#1f9d4a" stroke-width="5"`))}
for(const e of LINKS){const pts=extendEnds(e.pts,14);p.push(`<polyline points="${poly(pts)}" fill="none" stroke="#f3ddb8" stroke-width="${HALL}" stroke-linecap="round" stroke-linejoin="round"/>`);p.push(`<polyline points="${poly(pts)}" fill="none" stroke="#c6a67a" stroke-width="1.5" stroke-dasharray="9 7" stroke-linecap="round" stroke-linejoin="round"/>`)}
p.push(`<g pointer-events="none">`);
for(const l of HALL_LABELS){const tr=l.rot?` transform="rotate(${l.rot} ${l.x} ${l.y})"`:"";p.push(`<text x="${l.x}" y="${l.y}"${tr} text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="800" fill="#6a4e3c" letter-spacing="1.6" font-family="system-ui,sans-serif">${l.t}</text>`)}
p.push(`</g>`);
p.push(`<g pointer-events="none" transform="translate(724,392)"><circle r="26" fill="#5c3d2c" stroke="#c4a574" stroke-width="2"/><circle r="20" fill="none" stroke="#e6b15a" stroke-width="1.2"/><g transform="translate(0,-4)"><circle r="5.5" fill="#fffaf3" stroke="#e6d2b4" stroke-width="1"/><path d="M4.6 0h2.6a2 2 0 0 1 0 4H4.6" fill="none" stroke="#e6d2b4" stroke-width="1"/><ellipse cy="-1" rx="2.2" ry=".9" fill="#6b3e2a"/></g><text y="16" text-anchor="middle" font-size="8" font-weight="800" fill="#f6ebdd" letter-spacing=".8" font-family="system-ui,sans-serif">CAFÉ</text></g>`);
for(const v of VENT_DRAW){p.push(`<g pointer-events="none"><polyline points="${poly(v.pts)}" fill="none" stroke="#241810" stroke-width="8" stroke-dasharray="1 7" stroke-linecap="round"/><polyline points="${poly(v.pts)}" fill="none" stroke="#eadcc8" stroke-width="3" stroke-dasharray="1 8" stroke-linecap="round"/><text x="${v.lx}" y="${v.ly}" font-size="11" font-weight="800" fill="#f6ebdd" stroke="#2a211c" stroke-width="3" paint-order="stroke" font-family="system-ui,sans-serif">ventila</text></g>`)}
for(const name in ROOMS){const r=ROOMS[name];const items=peopleIn(name,M);const laid=layout(name,items);let folks="";for(const spot of laid){if(walk&&spot.it.self&&!spot.it.body)continue;const key=spot.it.name+(spot.it.body?"#cuerpo":"");const pop=knownPeople&&!knownPeople.has(key)&&!reduceMotion?"pop":"";names.add(key);folks+=figure(spot.it,cl,spot.x,spot.y,spot.fs,spot.sc,spot.mode,pop)}const icon=name==="Barra"?iconFor(name):`<g transform="translate(${r.icon[0]},${r.icon[1]})">${iconFor(name)}</g>`;p.push(`<g pointer-events="none">${icon}${roomLabel(r)}${tasks.has(name)?taskBadge(r.badge[0],r.badge[1]):""}</g>`);p.push(folks)}
if(walk&&M){const t=Math.min(1,(performance.now()-walk.t0)/walk.dur);const pos=pointAt(walk.pts,ease(t));const dir=faceSign(walk.pts,t);p.push(`<g id="walker" transform="translate(${pos.x.toFixed(1)},${pos.y.toFixed(1)})" pointer-events="none"><ellipse cx="0" cy="14" rx="13" ry="3.6" fill="none" stroke="#e2a20e" stroke-width="1.6"/><g class="face" transform="scale(${dir},1)"><g transform="scale(1.05)">${crewBean(cl[M.name]||"#c45cff",!M.alive)}</g></g><text x="0" y="-20" text-anchor="middle" font-size="11" font-weight="700" fill="#8a5a10" stroke="#fff6e4" stroke-width="3" paint-order="stroke" font-family="system-ui,sans-serif">tú</text>${nameTag(0,24,M.name,13,"middle","")}</g>`)}
for(const v of VENT_DRAW){p.push(grate(v.ga[0],v.ga[1],false));p.push(grate(v.gb[0],v.gb[1],false))}
for(const name in ROOMS){const r=ROOMS[name];const can=exits.has(name);const title=`<title>${esc(name)}${can?". Puedes entrar.":""}</title>`;p.push(roomEl(r,`class="hit${can?" can":""}" ${can?`data-move="${esc(name)}"`:""} fill="transparent"`,title))}
for(const v of VENT_DRAW){const hot=canVent&&((here===v.a&&M.vent===v.b)||(here===v.b&&M.vent===v.a));if(hot){p.push(grate(v.ga[0],v.ga[1],true));p.push(grate(v.gb[0],v.gb[1],true))}}
p.push(legend());p.push(`</svg>`);
document.getElementById("map").innerHTML=p.join("");
const root=document.getElementById("map");
root.querySelectorAll("[data-move]").forEach(el=>{el.addEventListener("click",()=>post({action:"move",target:el.getAttribute("data-move")}))});
root.querySelectorAll("[data-vent]").forEach(el=>{el.addEventListener("click",ev=>{ev.stopPropagation();post({action:"vent"})})});
knownPeople=names;
if(M&&!walk){const slot=slotOf(M);selfAnchor=slot}
}
function drawMap(cl){lastCl=cl||lastCl;syncWalk(S.me);paint();if(walk)ensureLoop()}
function draw(){const M=S.me;const cl={};S.players.forEach((p,i)=>cl[p.name]=COL[i%10]);drawMap(cl);
const[dn,t]=S.progress;document.getElementById("prog").style.width=(t?dn/t*100:0)+"%";
document.getElementById("log").innerHTML=S.log.map(x=>`<div>${x}</div>`).join("");document.getElementById("log").scrollTop=1e9;
let h="";if(!M){h=`<b>Únete</b><br><input id=n placeholder="Tu nombre"><button onclick="post({action:'join',name:n.value})">Entrar</button>`}
else{h=`<div>Hola <b style="color:${cl[M.name]}">${M.name}</b> ${M.alive?"":"👻"}</div>`;
if(S.phase=="lobby")h+=`<p>Jugadores: ${S.players.map(p=>p.name).join(", ")}</p><button onclick="post({action:'start'})">Empezar partida</button>`;
else{h+=`<div class=big style="color:${M.role=="impostor"?"#e0435a":"#5fe08a"}">${M.role=="impostor"?"🔪 IMPOSTOR":"🧑‍🚀 TRIPULANTE"}</div><div>Estás en <b>${M.room}</b></div>`;
if(M.role=="tripulante")h+=`<div>Tareas: ${M.tasks.join(", ")||"¡listas!"}</div>`;
if(S.phase=="play"){if(M.tasks.includes(M.room)||M.role=="impostor")h+=`<button onclick="post({action:'task'})">Hacer tarea</button>`;
if(M.alive){if(M.role=="impostor")M.here.forEach(n=>h+=`<button class=red onclick="post({action:'kill',target:'${n}'})">Matar a ${n}</button>`)+(M.cd?`<div>Enfriamiento: ${M.cd}</div>`:"");
if(M.bodies.length)h+=`<button class=red onclick="post({action:'report'})">Reportar cuerpo</button>`;h+=`<button class=gray onclick="post({action:'meeting'})">🚨 Emergencia</button>`}
h+=`<p style="font-size:12px">Haz clic en una sala con borde verde para moverte.</p>`}
if(S.phase=="meeting"){h+=`<h3>🗳️ Reunión</h3><input id=c placeholder="Di algo"><button onclick="post({action:'chat',text:c.value})">Hablar</button><br>`;
if(M.alive)S.players.filter(p=>p.alive).forEach(p=>h+=`<button onclick="post({action:'vote',target:'${p.name}'})">${p.name}${p.voted?" ✔":""}</button>`)+(h+=`<button class=gray onclick="post({action:'vote',target:'skip'})">Saltar</button>`)}
if(S.phase=="end")h+=`<div class=big>${S.winner}</div>`}
h+=`<p><button class=gray onclick="if(confirm('¿Reiniciar la partida para todos?')){localStorage.ib='{}';me={};post({action:'reset'})}">Nueva partida</button></p>`}
document.getElementById("panel").innerHTML=h}
poll();setInterval(()=>{if(!document.activeElement||document.activeElement.tagName!="INPUT")poll()},2000);
</script></html>

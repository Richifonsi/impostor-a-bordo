<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f3e6d4">
<title>Impostor a Bordo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Tema reutilizable — vidrio líquido de cafetería.
   Variables en :root y clases: .glass, .glass-inset, .btn, .btn-primary,
   .btn-danger, .btn-ghost, .chip, .kicker, .hint, .field, .role-banner,
   .is-impostor, .is-crew, .bar, .ico, .duty.
   Los botones .red y .gray siguen igual de válidos.
   El plano de cubierta, las tazas y la mesa de reunión se suman aparte. */
:root{
  --espresso:#3a2418;
  --espresso-deep:#26160f;
  --crema:#f6eadc;
  --latte:#ead5bb;
  --foam:#fffaf4;
  --amber:#e2a24a;
  --amber-deep:#b8752a;
  --ink:#3a2418;
  --ink-soft:rgba(58,36,24,.72);
  --danger:#a33b32;
  --ok:#24613d;
  --glass:rgba(255,250,244,.58);
  --glass-strong:rgba(255,252,248,.74);
  --glass-border:rgba(255,255,255,.7);
  --shadow:0 18px 44px rgba(74,42,20,.13),0 2px 6px rgba(74,42,20,.06);
  --radius:24px;
  --radius-sm:14px;
  --blur:22px;
  --font:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
html{color-scheme:light}
body{
  margin:0;min-height:100vh;color:var(--ink);font-family:var(--font);font-weight:500;
  text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(540px 320px at 6% -4%,rgba(255,226,186,.9),transparent 68%),
    radial-gradient(460px 300px at 102% 6%,rgba(184,116,52,.22),transparent 70%),
    radial-gradient(620px 420px at 72% 108%,rgba(90,48,24,.14),transparent 62%),
    linear-gradient(180deg,#fbf6ee 0%,#f3e4d0 46%,#e7d2b6 100%);
}
.atmosphere{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.atmosphere span{position:absolute;border-radius:50%;filter:blur(28px)}
.atmosphere span:nth-child(1){width:380px;height:380px;background:rgba(255,214,168,.5);top:-90px;left:-70px}
.atmosphere span:nth-child(2){width:300px;height:300px;background:rgba(196,122,42,.2);top:30px;right:-50px}
.atmosphere span:nth-child(3){width:440px;height:440px;background:rgba(92,54,28,.14);bottom:-140px;left:28%}
.glass,.card{
  position:relative;isolation:isolate;box-sizing:border-box;
  background:linear-gradient(180deg,var(--glass-strong),var(--glass));
  border:1px solid var(--glass-border);border-radius:var(--radius);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.85),inset 0 -1px 0 rgba(90,52,28,.05);
  backdrop-filter:blur(var(--blur)) saturate(1.55);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(1.55);
}
.glass::after,.card::after{
  content:"";position:absolute;z-index:3;left:14%;right:14%;top:0;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);
}
.card::before{
  content:"";position:absolute;z-index:0;left:0;right:0;top:0;height:76px;pointer-events:none;border-radius:inherit;
  background:linear-gradient(180deg,rgba(255,255,255,.42),transparent);
}
.card>*{position:relative;z-index:1}
.glass-inset{
  background:rgba(255,250,244,.46);
  border:1px solid rgba(255,255,255,.55);
  box-shadow:inset 0 1px 3px rgba(62,36,18,.08);
  border-radius:16px;
}
.wrap{
  position:relative;z-index:1;display:grid;align-items:start;
  grid-template-columns:minmax(0,1fr) 360px;grid-template-areas:"mast mast" "map side";
  gap:14px;padding:18px 16px 32px;max-width:1180px;margin:0 auto;
}
.mast{grid-area:mast;display:flex;justify-content:center}
.map-card{grid-area:map;padding:12px 12px 14px;min-width:0}
.side{grid-area:side;display:flex;flex-direction:column;gap:12px;min-width:0}
.brand{
  display:flex;align-items:center;gap:12px;padding:8px 18px 8px 8px;border-radius:999px;
}
.brand-mark{
  width:40px;height:40px;display:grid;place-items:center;border-radius:14px;color:var(--amber-deep);
  background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,232,206,.45));
  box-shadow:inset 0 1px 0 #fff,0 8px 16px rgba(120,72,24,.12);
}
.brand-mark svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
h1{margin:0;font-size:clamp(22px,3vw,30px);font-weight:800;letter-spacing:-.03em;color:var(--espresso)}
h2,h3{font-weight:800;color:var(--ink);letter-spacing:-.02em}
h2{margin:0;font-size:22px}
h3{margin:12px 0 8px;font-size:18px}
.kicker{
  display:block;margin:0 0 6px;font-size:11px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-soft);
}
.hint{margin:8px 0 0;font-size:12.5px;line-height:1.45;color:var(--ink-soft)}
.hello{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:15px}
.pname{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--ink)}
.swatch{
  width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;
  box-shadow:inset 0 0 0 1px rgba(58,36,24,.28),0 0 0 1px rgba(255,255,255,.85);
}
.role-banner{
  display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px 14px;border-radius:18px;
  border:1px solid rgba(255,255,255,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.75);
}
.role-banner strong{display:block;font-size:22px;letter-spacing:.04em;line-height:1.1}
.role-banner .ico{width:28px;height:28px}
.is-crew{color:var(--ok);background:linear-gradient(180deg,rgba(223,236,214,.72),rgba(255,252,248,.4))}
.is-impostor{color:var(--danger);background:linear-gradient(180deg,rgba(244,214,206,.78),rgba(255,248,244,.42))}
.is-crew .ico{color:var(--ok)}
.is-impostor .ico{color:var(--danger)}
.block{margin-top:14px}
.stat-value{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.duties{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.duty{
  display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius-sm);
  background:rgba(255,252,248,.5);border:1px solid rgba(255,255,255,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7);
}
.duty span{min-width:0}
.duty b{display:block;font-size:14px;font-weight:800}
.duty small{display:block;margin-top:1px;color:var(--ink-soft);font-size:11px}
.duty.is-here{box-shadow:inset 0 0 0 1.5px rgba(184,117,42,.9),inset 0 1px 0 rgba(255,255,255,.7)}
.duty.is-done{opacity:.58}
.duty.is-done b{text-decoration:line-through}
.tick{margin-left:auto;color:var(--ok);font-weight:800}
.done-note{margin:8px 0 0;font-weight:800;color:var(--ok)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.actions button,.chips button{margin:0}
.cooldown{
  margin:8px 0 0;font-size:13px;font-weight:700;color:var(--danger);
  padding:6px 10px;border-radius:999px;background:rgba(163,59,50,.1);display:inline-block;
}
button,.btn{
  box-sizing:border-box;appearance:none;font-family:inherit;font-weight:700;font-size:14px;
  color:var(--espresso);min-height:40px;
  background:linear-gradient(180deg,rgba(255,252,248,.94),rgba(236,214,186,.9));
  border:1px solid rgba(255,255,255,.82);border-radius:var(--radius-sm);
  padding:8px 14px;margin:3px;cursor:pointer;
  box-shadow:0 8px 16px rgba(74,42,20,.1),inset 0 1px 0 rgba(255,255,255,.9);
  transition:transform .15s ease,filter .15s ease;
}
button:hover,.btn:hover{transform:translateY(-1px)}
button:active,.btn:active{transform:translateY(0);filter:brightness(.98)}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber-deep);outline-offset:2px}
.btn-primary,button.btn-primary{
  color:#2a160e;
  background:linear-gradient(180deg,#f6d59a 0%,#e2a24a 52%,#c9842e 100%);
  border-color:rgba(255,236,205,.75);
  box-shadow:0 10px 18px rgba(180,110,30,.28),inset 0 1px 0 rgba(255,255,255,.75);
}
.btn-danger,button.red{
  color:#fff8f4;
  background:linear-gradient(180deg,#d36a58 0%,#a33b32 100%);
  border-color:rgba(255,220,210,.45);
  box-shadow:0 8px 16px rgba(140,48,40,.22),inset 0 1px 0 rgba(255,255,255,.35);
}
.btn-ghost,button.gray{
  color:var(--espresso);
  background:linear-gradient(180deg,rgba(255,250,244,.38),rgba(120,78,46,.14));
}
button.chip{
  display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:5px 10px;
  border-radius:999px;font-size:13px;font-weight:700;
  background:rgba(255,252,248,.55);
}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;color:var(--amber-deep);vertical-align:-3px}
.roster{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.roster li{
  display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;
  background:rgba(255,252,248,.55);border:1px solid rgba(255,255,255,.65);font-weight:700;
}
.join{display:flex;flex-direction:column;gap:10px}
.join .hint{margin:0}
.field{display:flex;flex-direction:column;gap:6px}
.join .btn-primary{width:100%;margin-top:2px}
input{
  box-sizing:border-box;padding:10px 12px;min-height:44px;border-radius:12px;width:150px;
  border:1px solid rgba(255,255,255,.78);background:rgba(255,252,248,.76);color:var(--espresso);
  font:inherit;font-weight:600;
  box-shadow:inset 0 1px 2px rgba(62,36,18,.08);
}
.field input{width:100%}
input::placeholder{color:rgba(58,36,24,.42)}
input:focus{outline:none;box-shadow:0 0 0 3px rgba(224,154,62,.35),inset 0 1px 2px rgba(62,36,18,.08)}
.log-card{padding:14px}
.log-card .section-title{margin:0 0 8px;font-size:16px}
#log{
  height:200px;overflow:auto;font-size:13px;line-height:1.45;padding:10px 12px;color:var(--ink-soft);
}
#log div+div{margin-top:6px}
.progress-block{margin-top:12px}
.progress-label{display:block;margin:0 4px 8px;font-size:13px;font-weight:800}
.bar{
  height:12px;border-radius:999px;overflow:hidden;
  background:rgba(62,36,18,.1);
  box-shadow:inset 0 1px 2px rgba(62,36,18,.18),inset 0 0 0 1px rgba(255,255,255,.35);
}
.bar div{
  height:100%;width:0;border-radius:inherit;
  background:linear-gradient(180deg,#f3d7a2 0%,#e2a24a 48%,#c47a2a 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7);
  transition:width .35s ease;
}
#log::-webkit-scrollbar,#map::-webkit-scrollbar{width:10px;height:10px}
#log::-webkit-scrollbar-thumb,#map::-webkit-scrollbar-thumb{
  background:rgba(90,52,28,.28);border-radius:999px;border:2px solid transparent;background-clip:padding-box;
}
.big{font-size:22px;text-align:center;padding:10px}
#map{position:relative;min-width:0;border-radius:16px}
#map svg.plano{width:100%;height:auto;display:block;border-radius:16px;user-select:none;background:#f4eadc}
#map .hit.can{cursor:pointer}
#map .hit.can:hover{fill:#1f9d4a24}
#map .venthot{cursor:pointer}
@keyframes ventpulse{50%{opacity:.4}}
#map .venthot .ring{animation:ventpulse 1.15s ease-in-out infinite}
@keyframes steam{0%,100%{opacity:.2}50%{opacity:.85}}
#map .steam{animation:steam 1.7s ease-in-out infinite}
@keyframes youpulse{50%{stroke-opacity:.55}}
#map .you{animation:youpulse 1.8s ease-in-out infinite}
@keyframes popin{from{opacity:0}to{opacity:1}}
#map .pop{animation:popin .35s ease}
svg.avatar{display:inline-block;overflow:visible;vertical-align:middle;flex:none}
.me-line svg.avatar{width:56px;height:64px}
.roster li svg.avatar{width:36px;height:42px}
button svg.avatar{width:22px;height:26px;margin-right:4px;vertical-align:middle}
.roster li.cup-chip{padding:3px 10px 3px 4px}
.chip-txt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.chip-txt small{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--danger)}
.roster li.dead{background:rgba(163,59,50,.12);border-color:rgba(163,59,50,.35)}
.roster li.dead b,.roster li.ghost b{text-decoration:line-through}
.roster li.ghost small{color:var(--ink-soft)}
.lives{display:inline-flex;align-items:center;gap:3px;margin-top:2px}
.lives .heart{width:13px;height:12px;fill:#e0435a;stroke:#7a2430;stroke-width:.7;stroke-linejoin:round}
.lives .heart.off{fill:#fffaf3;stroke:#b85a52}
.mtg-ghost .lives .heart.off{fill:#f4ebe4;stroke:#8a534c}
.lives-caption{display:block;margin-top:1px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.me-line .lives{margin-top:3px}
.mtg-id .lives{margin-top:4px}
.mtg-id .lives .heart{width:14px;height:13px}
#ib-mute{margin:8px 0 0}
@media (max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr);grid-template-areas:"mast" "map" "side";padding:12px}
  #map{overflow-x:auto;-webkit-overflow-scrolling:touch}
  #map svg.plano{min-width:680px}
}
@media (prefers-reduced-motion:reduce){
  button,.btn,.bar div{transition:none}
  #map .venthot .ring,#map .steam,#map .you,#map .pop{animation:none}
}

@media (prefers-reduced-transparency:reduce){
  .glass,.card{background:var(--crema);backdrop-filter:none;-webkit-backdrop-filter:none}
}
</style>
<style>
.mtg-note{margin:8px 0 0;font-size:13px;font-weight:700;color:var(--ink-soft)}
.mtg-overlay{--mtg-ink:#3a2418;--mtg-cream:#fff8ef;position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;overflow:auto;color:var(--mtg-ink);background-color:#3a2418;background-image:radial-gradient(ellipse at 50% -10%,rgba(255,214,160,.22),transparent 52%),repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 18px),linear-gradient(180deg,#6a4332,#24150f);font-family:system-ui,sans-serif}
.mtg-overlay[hidden]{display:none !important}
html:has(.mtg-overlay:not([hidden])),body:has(.mtg-overlay:not([hidden])){overflow:hidden}
.mtg-overlay *{box-sizing:border-box}
.mtg-overlay h2,.mtg-overlay h3,.mtg-overlay p{margin:0}
.mtg-banner{text-align:center;padding:22px 16px 6px}
.mtg-alert{display:inline-flex;align-items:center;gap:14px;text-align:left;max-width:calc(100% - 28px);padding:12px 26px 12px 16px;border-radius:999px;background:#fff6e4;border:3px solid #e2b15c;color:#6a3b12;box-shadow:0 12px 28px #140a0666}
.mtg-alert-emergency{animation:mtg-pulse 1.35s ease-in-out infinite}
.mtg-alert-body{background:#fbe8e2;border-color:#a8483c;color:#7c261c;animation:mtg-throb 1.5s ease-in-out infinite}
.mtg-enter .mtg-alert-emergency{animation:mtg-rise .4s ease,mtg-pulse 1.35s ease-in-out infinite}
.mtg-enter .mtg-alert-body{animation:mtg-rise .4s ease,mtg-throb 1.5s ease-in-out infinite}
.mtg-kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;opacity:.75}
.mtg-title{font-family:Georgia,"Iowan Old Style",Palatino,serif;font-size:clamp(24px,4vw,32px);line-height:1.05;font-weight:700}
.mtg-overlay svg{position:static;inset:auto;display:block;pointer-events:none}
.mtg-ico{width:36px;height:36px;flex:0 0 auto;transform-origin:50% 8%}
.mtg-alert-emergency .mtg-ico{animation:mtg-swing 1.05s ease-in-out infinite}
.mtg-alert-body .mtg-ico{animation:mtg-blink 1.15s ease-in-out infinite}
.mtg-detail{margin:10px auto 0;max-width:640px;color:#f6e6d0;font-size:15px}
.mtg-stage{flex:1;width:min(1120px,100%);margin:0 auto;padding:12px 16px 18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,330px);gap:14px;align-items:stretch}
.mtg-table{background:#f6e6cf;background-image:radial-gradient(#e4c8a4 1.1px,transparent 1.2px);background-size:16px 16px;border-radius:24px;padding:16px;border:1px solid #e7d0b0;box-shadow:0 16px 36px #140a0638;min-width:0}
.mtg-table-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.mtg-table h3,.mtg-chat h3,.mtg-result-title{font-family:Georgia,"Iowan Old Style",Palatino,serif;color:#4a2c1c}
.mtg-table h3{font-size:26px}
.mtg-count{color:#7a5a40;font-size:14px;font-weight:700}
.mtg-meter{height:8px;background:#e6d2b6;border-radius:99px;overflow:hidden;margin:10px 0 12px}
.mtg-meter span{display:block;height:100%;background:linear-gradient(90deg,#e0a045,#8a4524);border-radius:99px}
.mtg-you-voted,.mtg-skip-note,.mtg-ghost-hint{color:#7a5a40;font-size:13px}
.mtg-you-voted{margin-bottom:8px}
.mtg-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.mtg-enter .mtg-card{animation:mtg-card-in .4s ease both}
.mtg-enter .mtg-card:nth-child(2){animation-delay:.04s}
.mtg-enter .mtg-card:nth-child(3){animation-delay:.08s}
.mtg-enter .mtg-card:nth-child(4){animation-delay:.12s}
.mtg-enter .mtg-card:nth-child(5){animation-delay:.16s}
.mtg-card{position:relative;overflow:hidden;background:linear-gradient(180deg,#fffaf3,#f4e4cc);border:1px solid #e4c8a4;border-radius:18px;padding:12px 12px 12px 16px;box-shadow:0 8px 16px #3a241822;display:flex;flex-direction:column;gap:10px;min-width:0}
.mtg-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--mtg-c,#c45c32)}
.mtg-me{box-shadow:0 0 0 2px #e2b15c,0 8px 16px #3a241822}
.mtg-ghost{background:#e4d9cc;border-style:dashed;border-color:#b7a08c;box-shadow:none}
.mtg-ghost .mtg-name,.mtg-ghost .mtg-chip,.mtg-ghost .mtg-ghost-hint{color:#8d7d6e}
.mtg-ghost .mtg-avatar{filter:saturate(.55) brightness(.92)}
.mtg-card-top{display:flex;gap:10px;align-items:center;min-width:0;padding-right:72px}
.mtg-avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;flex:0 0 auto;border:3px solid #fffaf3;box-shadow:0 2px 0 #0002}
.mtg-id{min-width:0}
.mtg-name{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtg-chip{display:inline-block;margin-top:2px;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#8a6244}
.mtg-voted{position:absolute;top:10px;right:8px;background:#e7f6df;color:#245c32;border:2px solid #2f6b3a;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:800;letter-spacing:.02em}
.mtg-overlay button{font-family:system-ui,sans-serif;background:#7a3e24;color:#fff8ef;border:0;border-radius:999px;padding:8px 14px;margin:0;cursor:pointer;font-weight:800}
.mtg-overlay button:hover{filter:brightness(1.08)}
.mtg-card .mtg-btn{width:100%}
.mtg-overlay button.mtg-btn-skip{width:100%;margin-top:12px;background:transparent;color:#6b3e2a;border:2px dashed #a56b45;border-radius:14px;padding:12px}
.mtg-overlay button.mtg-btn-skip:hover{background:#f8ebda;filter:none}
.mtg-chat{background:#fff9f1;border:1px solid #e5d0b4;border-radius:24px;box-shadow:0 16px 36px #140a0638;display:flex;flex-direction:column;min-width:0;min-height:280px}
.mtg-chat h3{font-size:22px;padding:14px 16px 0}
.mtg-chat-log{flex:1;overflow:auto;min-height:160px;max-height:460px;padding:8px 12px 12px;display:flex;flex-direction:column;gap:6px}
.mtg-chat-spacer{flex:1 1 auto;min-height:0}
.mtg-msg{background:#fff3e4;border-radius:12px;padding:7px 9px}
.mtg-msg b{display:block;font-size:12px}
.mtg-msg span{display:block;font-size:14px;color:#3a2418;white-space:pre-wrap;word-break:break-word}
.mtg-msg-sys{background:transparent;color:#7a5b45;font-size:13px;font-style:italic;padding:2px 4px}
.mtg-msg-sys i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;font-style:normal}
.mtg-msg-ghost{opacity:.72}
.mtg-empty{color:#8a6a52;font-size:13px;padding:8px}
.mtg-chat-form{display:flex;gap:8px;padding:10px;border-top:1px solid #efdfcb}
.mtg-overlay input{width:auto;flex:1;min-width:0;border:1px solid #e0c7a4;background:#fff;color:#3a2418;border-radius:999px;padding:10px 14px;font-family:system-ui,sans-serif}
.mtg-chat-error{color:#8c2f24;font-size:12px;font-weight:700;padding:0 12px 10px}
.mtg-is-result{justify-content:center;align-items:center;padding:16px}
.mtg-result{width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;background:#fff8ef;border:1px solid #ead3b4;border-radius:28px;padding:26px 24px 20px;box-shadow:0 24px 60px #140a0666;text-align:center}
.mtg-enter .mtg-result{animation:mtg-rise .4s ease}
.mtg-result .mtg-kicker{color:#8a6244}
.mtg-result-title{font-size:34px;line-height:1.15;margin:8px 0}
.mtg-result-sub{color:#7a5a40;margin-bottom:14px}
.mtg-avatar-lg{width:84px;height:84px;font-size:34px;margin:12px auto 4px;box-shadow:0 0 0 6px #f4d6cc,0 0 0 10px #a33b32}
.mtg-safe-mark{width:72px;height:72px;margin:12px auto 4px;border-radius:50%;border:10px solid #d7b48a;box-shadow:inset 0 0 0 8px #f6e7d2}
.mtg-tally{display:flex;flex-direction:column;gap:8px;text-align:left;margin:8px 0 16px}
.mtg-row{display:grid;grid-template-columns:14px minmax(80px,1fr) minmax(80px,1.4fr) 24px;gap:8px;align-items:center;padding:6px;border-radius:10px}
.mtg-row-out{background:#f8e0d4}
.mtg-dot{width:12px;height:12px;border-radius:50%}
.mtg-row-name{font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mtg-row-track{height:12px;background:#efe0cc;border-radius:99px;overflow:hidden}
.mtg-row-fill{display:block;height:100%;border-radius:99px;transform-origin:left center;animation:mtg-grow .55s ease}
.mtg-row-n{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.mtg-raw{font-size:13px;color:#7a5a40;margin-bottom:12px}
.mtg-winner{margin:0 0 14px;padding:10px 12px;border-radius:12px;font-weight:800}
.mtg-winner-crew{background:#e5f4e4;color:#245c32}
.mtg-winner-imp{background:#fde4e0;color:#8c2a32}
.mtg-overlay button.mtg-btn-back{width:100%;padding:12px;background:#6b3e2a}
.mtg-overlay button:focus-visible,.mtg-overlay input:focus-visible{outline:3px solid #e0a030;outline-offset:2px}
@keyframes mtg-pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(224,160,48,.55)}50%{transform:scale(1.035);box-shadow:0 0 0 14px rgba(224,160,48,0)}}
@keyframes mtg-throb{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(168,56,48,.5)}50%{transform:scale(1.03);box-shadow:0 0 0 14px rgba(168,56,48,0)}}
@keyframes mtg-swing{0%,100%{transform:rotate(0)}20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(7deg)}80%{transform:rotate(-4deg)}}
@keyframes mtg-blink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes mtg-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes mtg-card-in{from{transform:translateY(12px)}to{transform:none}}
@keyframes mtg-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (max-width:820px){.mtg-stage{grid-template-columns:1fr;padding:8px}.mtg-title{font-size:26px}.mtg-chat-log{max-height:220px;min-height:120px}.mtg-result-title{font-size:28px}.mtg-card-top{padding-right:78px}}
@media (prefers-reduced-motion:reduce){.mtg-alert-emergency,.mtg-alert-body,.mtg-ico,.mtg-enter .mtg-card,.mtg-enter .mtg-result,.mtg-row-fill{animation:none !important}}
@media (max-width:820px){.mtg-alert{border-radius:22px;padding:10px 16px}}

<body>
<div class="atmosphere" aria-hidden="true"><span></span><span></span><span></span></div>
<main class="wrap">
  <header class="mast">
    <div class="brand glass">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M7 9h8.5v1.5a4.2 4.2 0 0 1-8.5 0V9z"/><path d="M15.5 10h1.8a2 2 0 0 1 0 4H15.5"/><path d="M9 6.2c.4.8 1 .8 1.4 0M12 5.6c.4.8 1 .8 1.4 0"/></svg>
      </span>
      <h1>Impostor a Bordo</h1>
    </div>
  </header>
  <section class="card glass map-card">
    <div id="map" aria-label="Plano de la cafetería"></div>
    <div class="progress-block">
      <span class="progress-label" id="prog-label">Tareas de la tripulación</span>
      <div class="bar" role="progressbar" aria-label="Tareas de la tripulación" aria-valuemin="0" aria-valuenow="0" aria-valuemax="0"><div id="prog" style="width:0"></div></div>
    </div>
  </section>
  <aside class="side">
    <div class="card glass" id="panel"></div>
    <section class="card glass log-card">
      <h2 class="section-title">Registro</h2>
      <div id="log" class="glass-inset"></div>
    </section>
  </aside>
</main>
<script src="/sounds.js"></script>
<script>

/* Vidrio líquido en el cascarón; el plano, las tazas, la mesa y el sonido llegan de los otros cambios. */
const COL=["#e0435a","#4a6cff","#5fe08a","#ffd54a","#c45cff","#ff8c3a","#3ad4ff","#ff7ad9","#b08968","#fff3e0"];
const TASK_NAME={"Barra":"Limpiar la barra","Tostadora":"Calibrar el tueste","Caja":"Cuadrar la caja","Bodega de granos":"Subir sacos de grano","Cuarto de máquinas":"Arreglar cables","Cámaras":"Revisar cámaras","Terraza":"Acomodar mesas","Cocina":"Hornear pandebonos","Molinos":"Ajustar la molienda","Caldera de espresso":"Purgar la caldera"};
const ICONS={
"Barra":'<path d="M7 9h8.5v1.5a4.2 4.2 0 0 1-8.5 0V9z"/><path d="M15.5 10h1.8a2 2 0 0 1 0 4H15.5"/><path d="M9 6.2c.4.8 1 .8 1.4 0M12 5.6c.4.8 1 .8 1.4 0"/>',
"Tostadora":'<path d="M6 9h12a1 1 0 0 1 1 1v6a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-6a1 1 0 0 1 1-1z"/><path d="M9 9V6.5M12 9V6M15 9V6.5M8 18.5v1.5M16 18.5v1.5"/>',
"Caja":'<path d="M5 8h14v10a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V8z"/><path d="M8 8V6h5v2M8 12h8M8 15h4"/>',
"Bodega de granos":'<path d="M8 8h8l1.5 3v8.5a1.5 1.5 0 0 1-1.5 1.5H8A1.5 1.5 0 0 1 6.5 19.5V11L8 8z"/><path d="M9.5 8c.4-1.5 1.4-2.2 2.5-2.2S14.1 6.5 14.5 8M9 13h6"/>',
"Cuarto de máquinas":'<path d="M8.5 4v4.5M15.5 4v4.5"/><rect x="6.5" y="8.5" width="11" height="6.5" rx="1.4"/><path d="M12 15v4"/>',
"Cámaras":'<path d="M4.5 8.5h3.2L9.2 6.5h5.6l1.5 2h3.2v9.5h-15V8.5z"/><circle cx="12" cy="13" r="2.4"/>',
"Terraza":'<path d="M4.5 12.5c1.4-4.2 4-6.5 7.5-6.5s6.1 2.3 7.5 6.5"/><path d="M4.5 12.5h15M12 12.5v6"/>',
"Cocina":'<path d="M7 11h10v5.5a3 3 0 0 1-3 3H10a3 3 0 0 1-3-3V11z"/><path d="M5.5 11h13M9 8.2c.3-1 .9-1 1.3 0M12.5 7.6c.3-1 .9-1 1.3 0"/>',
"Molinos":'<path d="M9 5h6v2.5l1.8 2.5V18a2 2 0 0 1-2 2H9.2a2 2 0 0 1-2-2V10l1.8-2.5V5z"/><path d="M10 5h4M9.5 16.5h5"/><circle cx="12" cy="12.5" r="1.2"/>',
"Caldera de espresso":'<rect x="6" y="6" width="9" height="11" rx="1.6"/><path d="M15 8.5h2.2a2 2 0 0 1 0 4H15M8.2 17.5v1.8M12.2 17.5v1.8M7.2 19.5h6M8.2 9h4.2"/>',
"bean":'<ellipse cx="12" cy="12" rx="4.2" ry="6.6" transform="rotate(-32 12 12)"/><path d="M10.4 8.4c.8 1.7 1.1 3.4.7 5.8" transform="rotate(-32 12 12)"/>'
};
let me=JSON.parse(localStorage.ib||"{}"),S=null,travelHint=null,CL={},svgSeq=0;
function ico(name){return `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]||ICONS.Barra}</svg>`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function post(o){
  const act=o&&o.action;
  if(act==="move"||act==="vent")travelHint=act;
  try{
    const r=await (await fetch("/",{method:"POST",body:JSON.stringify(Object.assign({name:me.name,token:me.token},o))})).json();
    /* "push" puede no existir todavía en el servidor: ese rechazo no tapa la animación. */
    const pushPending=act==="push"&&r.error==="Acción desconocida";
    if(r.error&&!pushPending)alert(r.error);
    if(r.token){me={name:o.name,token:r.token};localStorage.ib=JSON.stringify(me)}
    if(!r.error&&act==="kill")queueFx("attack",me.name,o.target);
    if((!r.error||pushPending)&&act==="push")queueFx("push",me.name,o.target);
    await poll();
    return r;
  }finally{if(act==="move"||act==="vent")travelHint=null}
}
async function poll(){
  S=await (await fetch(`/state?name=${encodeURIComponent(me.name||"")}&token=${me.token||""}`)).json();
  try{if(window.IBSound)IBSound.sync(S)}catch(e){}
  observeCombat();
  draw();
}
function whoName(x){return x&&typeof x==="object"?x.name:x}
function clampLives(n){const v=Number(n);if(!Number.isFinite(v))return null;return Math.max(0,Math.min(3,Math.round(v)))}
function livesOf(name,dead){
  if(!S||!name)return dead?0:3;
  const p=(S.players||[]).find(x=>x.name===name);
  const me=S.me&&S.me.name===name?S.me:null;
  const fromP=p?clampLives(p.lives):null;
  if(fromP!=null)return fromP;
  const fromM=me?clampLives(me.lives):null;
  if(fromM!=null)return fromM;
  const bags=[me&&me.here,me&&me.bodies];
  for(const bag of bags){if(!bag)continue;for(const item of bag){if(item&&typeof item==="object"&&item.name===name){const v=clampLives(item.lives);if(v!=null)return v}}}
  if(dead)return 0;
  if(me&&me.alive===false)return 0;
  if(p&&S.phase!=="play"&&p.alive===false)return 0;
  return 3;
}
function livesHtml(n){
  const c=clampLives(n);const v=c==null?3:c;
  let s=`<span class="lives" role="img" aria-label="${v} de 3 vidas">`;
  for(let i=0;i<3;i++)s+=`<svg class="heart${i<v?"":" off"}" viewBox="0 0 16 14" aria-hidden="true"><path d="M8 12.4S1.6 8.6 1.6 5.1A2.9 2.9 0 0 1 8 4.2a2.9 2.9 0 0 1 6.4.9c0 3.5-6.4 7.3-6.4 7.3z"/></svg>`;
  return s+"</span>";
}
function chipLi(name,mode){
  const tag=mode==="dead"?"cuerpo":mode==="ghost"?"fantasma":"";
  const dead=mode==="dead"||mode==="ghost";
  return `<li class="cup-chip ${mode}">${avatarSVG(name,mode,36)}<span class="chip-txt"><b>${esc(name)}</b>${livesHtml(livesOf(name,dead))}${tag?`<small>${tag}</small>`:""}</span></li>`;
}
function roomRoster(M){
  const meMode=M.alive?"live":"ghost";
  const hereNames=(M.here||[]).map(whoName).filter(Boolean);
  const bodyNames=(M.bodies||[]).map(whoName).filter(Boolean);
  let s=`<div class="block"><span class="kicker">En esta sala</span><ul class="roster">${chipLi(M.name,meMode)}${hereNames.map(n=>chipLi(n,"live")).join("")}</ul></div>`;
  if(bodyNames.length)s+=`<div class="block"><span class="kicker">Cuerpos</span><ul class="roster">${bodyNames.map(n=>chipLi(n,"dead")).join("")}</ul></div>`;
  return s;
}
function draw(){
  CL={};
  (S.players||[]).forEach((p,i)=>CL[p.name]=COL[i%COL.length]);
  svgSeq=0;
  drawMap(CL);
  const[dn,t]=S.progress;
  const prog=document.getElementById("prog");
  prog.style.width=(t?dn/t*100:0)+"%";
  const bar=prog.parentElement;
  bar.setAttribute("aria-valuenow",String(dn));
  bar.setAttribute("aria-valuemax",String(t||0));
  document.getElementById("prog-label").textContent=t?`Tareas de la tripulación · ${dn} de ${t}`:"Tareas de la tripulación";
  const log=document.getElementById("log");
  log.innerHTML=(S.log||[]).map(x=>`<div>${esc(x)}</div>`).join("");
  log.scrollTop=1e9;
  const M=S.me;
  let h="";
  if(!M){
    h=`<form class="join" aria-label="Unirse a la sala" onsubmit="event.preventDefault();post({action:'join',name:n.value})"><h2>Únete</h2><p class="hint">Escribe tu nombre. Todo el mundo entra a la misma sala.</p><label class="field"><span class="kicker">Nombre</span><input id="n" placeholder="Tu nombre" maxlength="20" autocomplete="off"></label><button class="btn btn-primary" type="submit">Entrar</button></form>`;
  }else{
    h=`<div class="hello me-line">${avatarSVG(M.name,M.alive?"live":"ghost",52)}<div><div>Hola <b class="pname">${esc(M.name)}</b> ${M.alive?"":"👻"}</div>${livesHtml(livesOf(M.name,!M.alive))}<span class="lives-caption">Vidas</span></div></div>`;
    if(S.phase=="lobby"){
      h+=`<div class="block"><span class="kicker">Jugadores</span><ul class="roster">${S.players.map(p=>chipLi(p.name,"live")).join("")}</ul><button class="btn btn-primary" onclick="post({action:'start'})">Empezar partida</button><p class="hint">Hacen falta al menos 3 jugadores.</p></div>`;
    }else{
      const imp=M.role=="impostor";
      h+=`<div class="role-banner ${imp?"is-impostor":"is-crew"}">${ico(imp?"bean":"Barra")}<div><span class="kicker">Tu rol</span><strong>${imp?"IMPOSTOR":"TRIPULANTE"}</strong></div></div>`;
      h+=`<div class="block"><span class="kicker">Sala</span><div class="stat-value">${ico(M.room)}<b>${esc(M.room)}</b></div></div>`;
      if(S.phase=="play"){
        h+=`<div class="block"><span class="kicker">Salidas</span><div class="chips">${M.exits.map(r=>`<button class="chip" type="button" onclick='post({action:"move",target:${JSON.stringify(r)}})'>${ico(r)}<span>${esc(r)}</span></button>`).join("")}</div></div>`;
        h+=roomRoster(M);
      }
      if(M.role=="tripulante"){
        const row=(r,done)=>`<li class="duty${done?" is-done":""}${!done&&r===M.room?" is-here":""}">${ico(r)}<span><b>${esc(TASK_NAME[r]||r)}</b><small>${esc(r)}</small></span>${done?`<span class="tick">✓</span>`:""}</li>`;
        h+=`<div class="block"><span class="kicker">Tareas</span><ul class="duties">${M.tasks.map(r=>row(r,false)).join("")}${(M.done||[]).map(r=>row(r,true)).join("")}</ul>${M.tasks.length?"":`<p class="done-note">¡listas!</p>`}</div>`;
      }
      if(S.phase=="play"){
        h+=`<div class="actions">`;
        if((M.tasks||[]).includes(M.room)||imp)h+=`<button class="btn btn-primary" type="button" onclick="post({action:'task'})">Hacer tarea</button>`;
        if(M.alive){
          (M.here||[]).forEach(n=>{const name=whoName(n);if(!name)return;h+=`<button class="btn btn-ghost gray" type="button" title="Empujar a quien está cerca" onclick='post({action:"push",target:${JSON.stringify(name)}})'>Empujar a ${esc(name)}</button>`});
          if(imp)(M.here||[]).forEach(n=>{const name=whoName(n);if(!name)return;h+=`<button class="btn btn-danger red" type="button" onclick='post({action:"kill",target:${JSON.stringify(name)}})'>${avatarSVG(name,"live",20)} Matar a ${esc(name)}</button>`});
          if((M.bodies||[]).length)h+=`<button class="btn btn-danger red" type="button" onclick="post({action:'report'})">Reportar cuerpo</button>`;
          h+=`<button class="btn btn-ghost gray" type="button" onclick="post({action:'meeting'})">🚨 Emergencia</button>`;
        }
        h+=`</div>`;
        if(imp&&M.cd)h+=`<p class="cooldown">Enfriamiento: ${M.cd}</p>`;
        h+=`<p class="hint">Haz clic en una sala con borde verde para moverte.</p>`;
      }
      if(S.phase=="meeting")h+=`<p class="mtg-note">Reunión en curso: la votación está en la mesa.</p>`;
      if(S.phase=="end"){
        h+=`<div class="big">${esc(S.winner||"")}</div>`;
        h+=`<div class="block"><span class="kicker">Tripulación</span><ul class="roster">${S.players.map(p=>chipLi(p.name,p.alive?"live":"ghost")).join("")}</ul></div>`;
      }
    }
    h+=`<p><button class="btn btn-ghost gray" type="button" onclick="if(confirm('¿Reiniciar la partida para todos?')){localStorage.ib='{}';me={};post({action:'reset'})}">Nueva partida</button></p>`;
  }
  document.getElementById("panel").innerHTML=h;
  mtgSync();
}

function hexShift(hex,amt){const n=parseInt(hex.slice(1),16);const ch=v=>Math.max(0,Math.min(255,v+amt)).toString(16).padStart(2,"0");return "#"+ch(n>>16)+ch((n>>8)&255)+ch(n&255)}
function luma(hex){const n=parseInt(hex.slice(1),16);return ((n>>16)*299+((n>>8)&255)*587+(n&255)*114)/1000}
function hexMix(a,b,t){const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16);const ch=m=>Math.round((A>>m&255)*(1-t)+(B>>m&255)*t).toString(16).padStart(2,"0");return "#"+ch(16)+ch(8)+ch(0)}
function decor(v,mark){
if(v===1)return `<path d="M13 34.6h18M13 40.4h18" stroke="${mark}" stroke-width="2.3" stroke-linecap="round"/>`;
if(v===2)return `<g fill="${mark}"><circle cx="15" cy="39" r="1.7"/><circle cx="22" cy="39" r="1.7"/><circle cx="29" cy="39" r="1.7"/></g>`;
if(v===6)return `<path d="M30 33.2l1 2 2.2.2-1.6 1.4.5 2.1-2.1-1.2-2.1 1.2.5-2.1-1.6-1.4 2.2-.2z" fill="#fff6c2" stroke="#3a241c" stroke-width=".6"/>`;
if(v===7)return `<path d="M13 39.2c2.4 1.8 3.4-1.8 5.6 0s3.2-1.8 5.6 0 3.2-1.8 5.8 0" fill="none" stroke="${mark}" stroke-width="1.6" stroke-linecap="round"/>`;
return "";
}
function cupParts(name,mode,colorOverride,variantOverride){
const players=(S&&S.players)||[];
let idx=players.findIndex(p=>p.name===name);if(idx<0)idx=0;
if(variantOverride!=null)idx=variantOverride;
const c=colorOverride||CL[name]||COL[idx%COL.length]||"#b08968";
const v=idx%8,ghost=mode==="ghost",dead=mode==="dead";
const dark=luma(c)>200?"#6d4c41":hexShift(c,-52);
const lite=hexShift(c,42);
const ink="#3a241c";
const mark=luma(c)>170?"rgba(58,36,28,.55)":"rgba(255,255,255,.8)";
const fill=ghost?hexMix(c,"#d7f3ff",.55):c;
const uid="c"+(++svgSeq);
const hand=v===5?"M10 27C2.2 27 2.2 38 10 38":"M34 27C41.8 27 41.8 38 34 38";
const p=[];
p.push(`<defs><linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${lite}"/><stop offset=".48" stop-color="${fill}"/><stop offset="1" stop-color="${dark}"/></linearGradient></defs>`);
if(dead){p.push(`<ellipse cx="26" cy="53" rx="13" ry="3.4" fill="#4e261e" opacity=".9"/>`);p.push(`<ellipse cx="15" cy="52.2" rx="4.5" ry="2" fill="#6d3428"/>`);p.push(`<circle cx="36" cy="50.5" r="1.5" fill="#6d3428"/>`)}
else if(!ghost)p.push(`<ellipse cx="22" cy="51" rx="9" ry="2" fill="#000" opacity=".22"/>`);
p.push(`<g transform="${dead?"rotate(-26 22 34)":""}">`);

function addedLines(prev, next){
  if(!prev.length||!next.length||next.length<prev.length)return [];

    const slice=prev.slice(prev.length-len);

      let ok=true;
      for(let j=0;j<len;j++) if(next[i+j]!==slice[j]){ok=false;break}

if(walk&&M){const t=Math.min(1,(performance.now()-walk.t0)/walk.dur);const at=pointAt(walk.pts,ease(t));const dir=faceSign(walk.pts,t);const mot=motionFor(M.name);p.push(`<g id="walker" transform="translate(${(at.x+mot.dx).toFixed(1)},${(at.y+mot.dy).toFixed(1)})" pointer-events="none"><ellipse cx="0" cy="15" rx="16" ry="4.2" fill="none" stroke="#e2a20e" stroke-width="1.6"/><g class="face" transform="scale(${dir},1)">${cupGlyph(M.name,M.alive?"live":"ghost")}</g>${livesMark(livesOf(M.name,!M.alive),-36)}<text x="0" y="-24" text-anchor="middle" font-size="11" font-weight="700" fill="#8a5a10" stroke="#fff6e4" stroke-width="3" paint-order="stroke" font-family="Manrope,system-ui,sans-serif">tú</text>${fxDecor(M.name)}${nameTag(0,28,M.name,13,"middle","")}</g>`)}
for(const v of VENT_DRAW){p.push(grate(v.ga[0],v.ga[1],false));p.push(grate(v.gb[0],v.gb[1],false))}
for(const name in ROOMS){const r=ROOMS[name];const can=exits.has(name);const title=`<title>${esc(name)}${can?". Puedes entrar.":""}</title>`;p.push(roomEl(r,`class="hit${can?" can":""}" ${can?`data-move="${esc(name)}"`:""} fill="transparent"`,title))}
for(const v of VENT_DRAW){const hot=canVent&&((here===v.a&&M.vent===v.b)||(here===v.b&&M.vent===v.a));if(hot){p.push(grate(v.ga[0],v.ga[1],true));p.push(grate(v.gb[0],v.gb[1],true))}}
p.push(legend());p.push(`</svg>`);
document.getElementById("map").innerHTML=p.join("");
const root=document.getElementById("map");
root.querySelectorAll("[data-move]").forEach(el=>{el.addEventListener("click",()=>post({action:"move",target:el.getAttribute("data-move")}))});
root.querySelectorAll("[data-vent]").forEach(el=>{el.addEventListener("click",ev=>{ev.stopPropagation();post({action:"vent"})})});
knownPeople=names;
if(M&&!walk){const slot=slotOf(M);selfAnchor=slot}
}
function drawMap(cl){lastCl=cl||lastCl;syncWalk(S.me);paint();if(walk||combatFx.length)ensureLoop()}
let mtgRoot=null,mtgPhase=null,mtgResult=null,mtgDraft="",mtgChatError="",mtgSig="";
function mtgEsc(s){return String(s==null?"":s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]))}
function mtgInk(hex){const n=parseInt(String(hex).slice(1),16);if(!Number.isFinite(n))return"#fffaf3";const r=(n>>16)&255,g=(n>>8)&255,b=n&255;return(0.299*r+0.587*g+0.114*b)/255>0.62?"#3a2418":"#fffaf3"}
function mtgColor(name){if(!S||!S.players)return"#8a6a52";const i=S.players.findIndex(p=>p.name===name);return i<0?"#8a6a52":COL[i%COL.length]}
function mtgInitial(name){const ch=Array.from(name||"?")[0]||"?";return mtgEsc(ch.toLocaleUpperCase("es"))}
function mtgReason(log){const rows=log||[];for(let i=rows.length-1;i>=0;i--){const line=rows[i];if(line.indexOf("reportó el cuerpo")!==-1)return{kind:"body",detail:line.replace(/^🚨\s*/,"")};if(line.indexOf("reunión de emergencia")!==-1)return{kind:"emergency",detail:line.replace(/^🚨\s*/,"")};if(line.indexOf("fue expulsado")!==-1)break}return{kind:"emergency",detail:"Alguien convocó la mesa."}}
function mtgSlice(log){const rows=log||[];let start=0;for(let i=rows.length-1;i>=0;i--){if(rows[i].indexOf("reportó el cuerpo")!==-1||rows[i].indexOf("reunión de emergencia")!==-1){start=i;break}}return rows.slice(start)}
function mtgParseVotes(raw){const votes=[];const re=/'((?:\\'|[^'])*)'\s*:\s*(\d+)/g;let m;while((m=re.exec(String(raw||""))))votes.push({name:m[1].replace(/\\'/g,"'"),count:+m[2]});return votes}
function mtgReadResult(log,winner){const rows=log||[];for(let i=rows.length-1;i>=0;i--){const line=rows[i];let m=/^(.*) fue expulsado al espacio\. Votos: (\{.*\})$/.exec(line);if(m)return{ejected:m[1],votes:mtgParseVotes(m[2]),raw:line,winner:winner||null};m=/^Nadie fue expulsado\. Votos: (\{.*\})$/.exec(line);if(m)return{ejected:null,votes:mtgParseVotes(m[1]),raw:line,winner:winner||null}}return{ejected:null,votes:[],raw:(rows[rows.length-1]||""),winner:winner||null,unknown:true}}
function mtgCanVote(){return !!(S&&S.me&&S.me.alive&&S.phase==="meeting")}
function mtgLineHtml(line){const say=/^(💬|👻)\s([^:]+):\s([\s\S]*)$/.exec(line);if(say){const ghost=say[1]==="👻";return`<div class="mtg-msg${ghost?" mtg-msg-ghost":""}"><b style="color:${mtgColor(say[2])}">${mtgEsc(say[2])}</b><span>${mtgEsc(say[3])}</span></div>`}const voted=/^(.+) votó\.$/.exec(line);if(voted)return`<div class="mtg-msg mtg-msg-sys"><i style="background:${mtgColor(voted[1])}"></i>${mtgEsc(voted[1])} votó.</div>`;return`<div class="mtg-msg mtg-msg-sys">${mtgEsc(line.replace(/^🚨\s*/,""))}</div>`}
function mtgCardsHtml(){const me=S.me&&S.me.name;const can=mtgCanVote();return (S.players||[]).map(p=>{const color=mtgColor(p.name);const ghost=!p.alive;const cls=["mtg-card",ghost?"mtg-ghost":"",p.name===me?"mtg-me":"",p.voted?"mtg-did":""].filter(Boolean).join(" ");const chip=ghost?"Fantasma":(p.name===me?"Tú":"En la mesa");const mark=p.voted?`<span class="mtg-voted">Ya votó</span>`:"";const action=ghost?`<p class="mtg-ghost-hint">No vota</p>`:(can?`<button type="button" class="mtg-btn" data-mtg-vote="${mtgEsc(p.name)}" aria-label="Votar por ${mtgEsc(p.name)}">Votar</button>`:`<p class="mtg-ghost-hint">Sin voto</p>`);return`<article class="${cls}" style="--mtg-c:${color}"><div class="mtg-card-top"><div class="mtg-avatar" style="background:${color};color:${mtgInk(color)}" aria-hidden="true">${mtgInitial(p.name)}</div><div class="mtg-id"><strong class="mtg-name" title="${mtgEsc(p.name)}">${mtgEsc(p.name)}</strong><span class="mtg-chip">${chip}</span>${livesHtml(livesOf(p.name,!p.alive))}</div>${mark}</div>${action}</article>`}).join("")}
function mtgMeetingHtml(){const reason=mtgReason(S.log);const title=reason.kind==="body"?"Cuerpo reportado":"Reunión de emergencia";const ico=reason.kind==="body"?`<svg class="mtg-ico" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="5.5" fill="currentColor"/><circle cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>`:`<svg class="mtg-ico" viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M16 3.2a1.8 1.8 0 0 1 1.8 1.8v1.1a7.4 7.4 0 0 1 5.7 7.2v3.6l1.9 2.8a1.2 1.2 0 0 1-1 1.9H7.6a1.2 1.2 0 0 1-1-1.9l1.9-2.8v-3.6a7.4 7.4 0 0 1 5.7-7.2V5A1.8 1.8 0 0 1 16 3.2z"/><path fill="currentColor" d="M12.6 23.2a3.4 3.4 0 0 0 6.8 0z"/></svg>`;const alive=(S.players||[]).filter(p=>p.alive);const n=alive.filter(p=>p.voted).length;const t=alive.length;const pct=t?Math.round(n/t*100):0;const meP=S.me&&(S.players||[]).find(p=>p.name===S.me.name);const note=meP&&meP.alive&&meP.voted?`<p class="mtg-you-voted">Tu voto ya está en la urna. Puedes cambiarlo.</p>`:"";const tail=mtgCanVote()?`<button type="button" class="mtg-btn mtg-btn-skip" data-mtg-vote="skip">Saltar voto</button>`:`<p class="mtg-skip-note">${S.me&&!S.me.alive?"Los fantasmas no votan. La mesa sigue sin ti.":"Estás mirando la mesa."}</p>`;const lines=mtgSlice(S.log).map(mtgLineHtml).join("")||`<p class="mtg-empty">La mesa está en silencio.</p>`;const err=mtgChatError?`<p class="mtg-chat-error" role="alert">${mtgEsc(mtgChatError)}</p>`:"";const form=S.me?`<form id="mtg-chat-form" class="mtg-chat-form" autocomplete="off"><input id="mtg-chat-input" class="mtg-input" maxlength="200" placeholder="Di algo en la mesa…" aria-label="Mensaje de la reunión"><button type="submit" class="mtg-btn mtg-btn-talk">Hablar</button></form>${err}`:`<p class="mtg-skip-note">Entra a la partida para hablar.</p>`;return`<header class="mtg-banner"><div class="mtg-alert mtg-alert-${reason.kind}" role="status">${ico}<div><p class="mtg-kicker">Atención</p><h2 id="mtg-title" class="mtg-title">${title}</h2></div></div><p class="mtg-detail">${mtgEsc(reason.detail)}</p></header><div class="mtg-stage"><section class="mtg-table" aria-label="Votación"><div class="mtg-table-head"><h3>¿Quién se va?</h3><p class="mtg-count">Han votado ${n} de ${t}</p></div><div class="mtg-meter" aria-hidden="true"><span style="width:${pct}%"></span></div>${note}<div class="mtg-cards">${mtgCardsHtml()}</div>${tail}</section><aside class="mtg-chat" aria-label="Chat de la reunión"><h3>Charla de la reunión</h3><div id="mtg-chat-log" class="mtg-chat-log"><div class="mtg-chat-spacer"></div>${lines}</div>${form}</aside></div>`}
function mtgTallyHtml(res){const votes=(res.votes||[]).slice().sort((a,b)=>b.count-a.count||a.name.localeCompare(b.name,"es"));if(!votes.length)return res.raw?`<p class="mtg-raw">${mtgEsc(res.raw)}</p>`:"";const max=votes.reduce((m,v)=>Math.max(m,v.count),1);return votes.map(v=>{const skip=v.name==="skip";const label=skip?"Saltar voto":v.name;const color=skip?"#8a6a52":mtgColor(v.name);const pct=Math.round(v.count/max*100);const hot=!skip&&res.ejected===v.name;return`<div class="mtg-row${hot?" mtg-row-out":""}"><span class="mtg-dot" style="background:${color}"></span><span class="mtg-row-name">${mtgEsc(label)}</span><span class="mtg-row-track"><span class="mtg-row-fill" style="width:${pct}%;background:${color}"></span></span><span class="mtg-row-n">${v.count}</span></div>`}).join("")}
function mtgResultHtml(res){const votes=res.votes||[];const top=votes.reduce((m,v)=>Math.max(m,v.count),0);const leaders=votes.filter(v=>v.count===top);let title,sub,hero;if(res.unknown){title="La votación terminó";sub=res.raw?mtgEsc(res.raw):"La mesa ya cerró.";hero=""}else if(res.ejected){const color=mtgColor(res.ejected);title=`<span style="color:${color}">${mtgEsc(res.ejected)}</span> fue expulsado`;sub="La mesa lo decidió.";hero=`<div class="mtg-avatar mtg-avatar-lg" style="background:${color};color:${mtgInk(color)}" aria-hidden="true">${mtgInitial(res.ejected)}</div>`}else if(leaders.length===1&&leaders[0].name==="skip"){title="Nadie fue expulsado";sub="Ganó saltar el voto.";hero=`<div class="mtg-safe-mark" aria-hidden="true"></div>`}else{title="Nadie fue expulsado";sub="Empate: no hay expulsión.";hero=`<div class="mtg-safe-mark" aria-hidden="true"></div>`}const win=res.winner?`<p class="mtg-winner ${String(res.winner).indexOf("tripulantes")!==-1?"mtg-winner-crew":"mtg-winner-imp"}">${mtgEsc(res.winner)}</p>`:"";return`<section class="mtg-result"><p class="mtg-kicker">Resultado de la votación</p>${hero}<h2 id="mtg-title" class="mtg-result-title">${title}</h2><p class="mtg-result-sub">${sub}</p><div class="mtg-tally">${mtgTallyHtml(res)}</div>${win}<button type="button" class="mtg-btn mtg-btn-back" data-mtg-dismiss>Volver a la cafetería</button></section>`}
function mtgSignature(){if(mtgResult)return"result\n"+(mtgResult.raw||"")+"\n"+(mtgResult.winner||"")+"\n"+(mtgResult.ejected||"");const reason=mtgReason(S.log);const people=(S.players||[]).map(p=>p.name+":"+(p.alive?"1":"0")+":"+(p.voted?"1":"0")+":"+livesOf(p.name,!p.alive)).join("|");const who=S.me?S.me.name+":"+(S.me.alive?"1":"0")+":"+livesOf(S.me.name,!S.me.alive):"";return"meet\n"+reason.kind+"\n"+reason.detail+"\n"+people+"\n"+who+"\n"+mtgSlice(S.log).join("\n")+"\n"+mtgChatError}
function mtgEnsure(){if(mtgRoot)return mtgRoot;mtgRoot=document.createElement("div");mtgRoot.id="mtg-root";mtgRoot.className="mtg-overlay";mtgRoot.hidden=true;mtgRoot.setAttribute("role","dialog");mtgRoot.setAttribute("aria-modal","true");mtgRoot.setAttribute("aria-labelledby","mtg-title");mtgRoot.addEventListener("click",mtgOnClick);mtgRoot.addEventListener("submit",mtgOnSubmit);document.body.appendChild(mtgRoot);document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&mtgResult)mtgDismiss()});return mtgRoot}
function mtgSetInert(on){const wrap=document.querySelector(".wrap");const h1=document.querySelector("h1");if(wrap)wrap.inert=on;if(h1)h1.inert=on}
function mtgPaint(){const root=mtgEnsure();const show=!!(S&&(S.phase==="meeting"||mtgResult));mtgSetInert(show);if(!show){root.hidden=true;root.setAttribute("aria-hidden","true");if(mtgSig){root.innerHTML="";mtgSig=""}return}const sig=mtgSignature();if(sig===mtgSig&&!root.hidden)return;const mode=sig.startsWith("result")?"result":"meet";const prev=mtgSig.startsWith("result")?"result":(mtgSig.startsWith("meet")?"meet":"");const enter=mode!==prev;const prevInput=document.getElementById("mtg-chat-input");if(prevInput)mtgDraft=prevInput.value;const logEl=document.getElementById("mtg-chat-log");const stick=!logEl||logEl.scrollHeight-logEl.scrollTop-logEl.clientHeight<48;const prevScroll=logEl?logEl.scrollTop:0;const focused=!!(prevInput&&document.activeElement===prevInput);const sel=focused?[prevInput.selectionStart,prevInput.selectionEnd]:null;let cls="mtg-overlay mtg-is-"+mode+(enter?" mtg-enter":"");if(mode==="meet")cls+=" mtg-kind-"+mtgReason(S.log).kind;root.hidden=false;root.removeAttribute("aria-hidden");root.className=cls;mtgSig=sig;root.innerHTML=mode==="result"?mtgResultHtml(mtgResult):mtgMeetingHtml();const input=document.getElementById("mtg-chat-input");if(input){input.value=mtgDraft;if(focused){input.focus();if(sel)input.setSelectionRange(sel[0],sel[1])}}const box=document.getElementById("mtg-chat-log");if(box)box.scrollTop=stick?box.scrollHeight:prevScroll}
function mtgSync(){if(!S)return;if(S.phase==="meeting"){if(mtgPhase!=="meeting"){mtgDraft="";mtgChatError=""}mtgResult=null}else if(mtgPhase==="meeting")mtgResult=mtgReadResult(S.log,S.winner);mtgPhase=S.phase;mtgPaint()}
function mtgOnClick(ev){const vote=ev.target.closest&&ev.target.closest("[data-mtg-vote]");if(vote){post({action:"vote",target:vote.getAttribute("data-mtg-vote")});return}if(ev.target.closest&&ev.target.closest("[data-mtg-dismiss]"))mtgDismiss()}
function mtgOnSubmit(ev){if(!ev.target||ev.target.id!=="mtg-chat-form")return;ev.preventDefault();const input=document.getElementById("mtg-chat-input");const text=(input&&input.value||"").trim();if(!text)return;mtgSendChat(text)}
async function mtgSendChat(text){try{const r=await(await fetch("/",{method:"POST",body:JSON.stringify({name:me.name,token:me.token,action:"chat",text})})).json();if(r.error){mtgChatError=r.error;mtgPaint();return}mtgChatError="";mtgDraft="";const input=document.getElementById("mtg-chat-input");if(input)input.value="";poll()}catch(e){mtgChatError="No se pudo enviar el mensaje.";mtgPaint()}}
function mtgDismiss(){mtgResult=null;mtgSig="";mtgPaint()}

poll();
setInterval(()=>{if(!document.activeElement||document.activeElement.tagName!='INPUT')poll()},2000);
</script>

<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Impostor a Bordo</title>
<style>
body{margin:0;font-family:system-ui;background:radial-gradient(#1b2340,#05070f);color:#eef;min-height:100vh}
h1{text-align:center;margin:14px;letter-spacing:2px}.wrap{display:grid;grid-template-columns:1fr 340px;gap:14px;padding:14px;max-width:1150px;margin:auto}
.card{background:#ffffff12;border:1px solid #ffffff22;border-radius:16px;padding:14px;backdrop-filter:blur(8px)}
#map{position:relative;min-width:0}
#map svg.plano{width:100%;height:auto;display:block;border-radius:18px;box-shadow:0 10px 28px #0005;user-select:none}
#map .hit.can{cursor:pointer}
#map .hit.can:hover{fill:#1f9d4a24}
#map .venthot{cursor:pointer}
@keyframes ventpulse{50%{opacity:.45}}
#map .venthot .ring{animation:ventpulse 1.15s ease-in-out infinite}
button{background:#4a6cff;color:#fff;border:0;border-radius:10px;padding:8px 12px;margin:3px;cursor:pointer;font-weight:600}button.red{background:#e0435a}button.gray{background:#556}
#log{height:240px;overflow:auto;font-size:13px;line-height:1.45}input{padding:8px;border-radius:8px;border:0;width:140px}
.bar{height:10px;background:#333;border-radius:6px;overflow:hidden}.bar div{height:100%;background:#5fe08a}
.big{font-size:22px;text-align:center;padding:10px}
</style>
<h1>🚀 IMPOSTOR A BORDO</h1>
<div class="wrap"><div class="card"><div id="map" aria-label="Plano de la cafetería"></div>
<div>Tareas de la tripulación</div><div class="bar"><div id="prog" style="width:0"></div></div></div>
<div><div class="card" id="panel"></div><div class="card" style="margin-top:12px"><b>Registro</b><div id="log"></div></div></div></div>
<script>
const COL=["#e0435a","#4a6cff","#5fe08a","#ffd54a","#c45cff","#ff8c3a","#3ad4ff","#ff7ad9","#aaa","#fff"];
let me=JSON.parse(localStorage.ib||"{}"),S=null;
async function post(o){const r=await (await fetch("/",{method:"POST",body:JSON.stringify(Object.assign({name:me.name,token:me.token},o))})).json();if(r.error)alert(r.error);if(r.token){me={name:o.name,token:r.token};localStorage.ib=JSON.stringify(me)}poll();return r}
async function poll(){S=await (await fetch(`/state?name=${encodeURIComponent(me.name||"")}&token=${me.token||""}`)).json();draw()}
/* Plano de la cafetería. Los ductos repiten VENTS de server.py; el clic usa me.vent. */
const ROOM_LIST=[
  ["Tostadora",28,64,170,108],
  ["Barra",250,56,450,124],
  ["Terraza",762,64,188,108],
  ["Caja",274,220,186,100],
  ["Cocina",762,216,188,110],
  ["Cuarto de máquinas",28,368,170,108],
  ["Bodega de granos",250,360,450,120],
  ["Cámaras",28,516,170,100],
  ["Molinos",274,516,186,100],
  ["Caldera de espresso",762,508,188,112]
];
const ROOM={};for(const[n,x,y,w,h]of ROOM_LIST)ROOM[n]={name:n,x,y,w,h};
const FLOOR={"Tostadora":"#f6e3c8","Barra":"#fbf3e4","Terraza":"#fbf0d6","Caja":"#f8f0dc","Cocina":"#f8e0cc","Cuarto de máquinas":"#e8dccb","Bodega de granos":"#f0ddbc","Cámaras":"#efe4d6","Molinos":"#f5e6c8","Caldera de espresso":"#f6dcc4"};
const HALLS=[[186,104,76,32],[688,104,86,32],[88,16,804,22],[96,34,30,42],[854,34,30,42],[340,168,38,64],[340,308,38,64],[508,168,42,204],[838,160,36,68],[714,250,86,36],[714,250,48,180],[660,390,102,40],[186,412,76,32],[96,464,36,64],[340,468,38,60],[186,556,100,30],[448,556,326,30],[100,604,34,56],[840,608,34,52],[100,648,774,24]];
const HALL_LABELS=[{x:490,y:31,t:"pasillo"},{x:529,y:290,t:"pasillo",rot:-90},{x:611,y:576,t:"pasillo"},{x:487,y:665,t:"pasillo"}];
const VENT_LINKS=[
  {a:"Cuarto de máquinas",b:"Cámaras",x1:168,y1:448,x2:168,y2:582,ga:[153,432],gb:[153,566],lx:204,ly:512},
  {a:"Terraza",b:"Cocina",x1:908,y1:150,x2:908,y2:248,ga:[893,138],gb:[893,236],lx:924,ly:198}
];
function esc(s){return String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]))}
function shade(hex,d){const n=parseInt(hex.slice(1),16);const c=v=>Math.max(0,Math.min(255,v+d));return"#"+[c(n>>16),c((n>>8)&255),c(n&255)].map(v=>v.toString(16).padStart(2,"0")).join("")}
function mute(hex){const n=parseInt(hex.slice(1),16);const m=c=>Math.round(c*0.38+132);return"#"+[m(n>>16),m((n>>8)&255),m(n&255)].map(v=>v.toString(16).padStart(2,"0")).join("")}
function crewBean(color,ghost){const dark=shade(color,-52);const vis=ghost?"#e4dff6":"#c9f6ff";return`<g opacity="${ghost?.5:1}"><ellipse cx="0" cy="14" rx="9" ry="2.4" fill="#000" opacity=".16"/><rect x="-11.2" y="-5" width="5.6" height="11" rx="2.6" fill="${dark}" stroke="#241c16" stroke-width=".6"/><rect x="-7" y="-12" width="14" height="22" rx="7" fill="${color}" stroke="#241c16" stroke-width=".7"/><rect x="-6.2" y="8" width="5" height="5.2" rx="2" fill="${dark}" stroke="#241c16" stroke-width=".45"/><rect x="1.3" y="8" width="5" height="5.2" rx="2" fill="${dark}" stroke="#241c16" stroke-width=".45"/><rect x="-1.2" y="-7" width="11" height="8" rx="3.2" fill="${vis}" stroke="#241c16" stroke-width=".65"/><ellipse cx="5.2" cy="-4.6" rx="2" ry="1" fill="#fff" opacity=".75"/></g>`}
function bodyBean(color){const dark=shade(color,-36);return`<g><ellipse cx="1" cy="9" rx="13" ry="3" fill="#000" opacity=".16"/><rect x="-17" y="-4" width="6" height="9" rx="2.4" fill="${dark}" stroke="#241c16" stroke-width=".6"/><rect x="-13" y="-8" width="28" height="15" rx="7.5" fill="${color}" stroke="#241c16" stroke-width=".75"/><rect x="-9" y="5" width="5" height="4.2" rx="1.6" fill="${dark}" stroke="#241c16" stroke-width=".4"/><rect x="-2" y="5" width="5" height="4.2" rx="1.6" fill="${dark}" stroke="#241c16" stroke-width=".4"/><rect x="4" y="-12" width="13" height="8" rx="3.2" fill="#4e4944" stroke="#241c16" stroke-width=".65"/><path d="M7.2-10.2l6.2 4.8M13.4-10.2l-6.2 4.8" stroke="#f4eadc" stroke-width="1.15"/></g>`}
function nameTag(x,y,text,fs,anchor,sub){const fs2=Math.max(8,fs-2);const w=Math.max(String(text).length*fs*0.58,(sub?String(sub).length*fs2*0.58:0))+12;const h=sub?fs+fs2+7:fs+6;const left=anchor==="middle"?x-w/2:x;const tx=anchor==="middle"?x:x+6;const ta=anchor==="middle"?"middle":"start";return`<g pointer-events="none"><rect x="${left.toFixed(1)}" y="${(y-fs).toFixed(1)}" width="${w.toFixed(1)}" height="${h}" rx="4" fill="#fffaf3" fill-opacity=".94" stroke="#e4d2b4" stroke-width=".6"/><text x="${tx.toFixed(1)}" y="${y}" text-anchor="${ta}" font-size="${fs}" font-weight="700" fill="#3f2a1c" font-family="system-ui,sans-serif">${esc(text)}</text>${sub?`<text x="${tx.toFixed(1)}" y="${y+fs2+1}" text-anchor="${ta}" font-size="${fs2}" font-weight="700" fill="#8a4032" font-family="system-ui,sans-serif">${esc(sub)}</text>`:""}</g>`}
function figure(it,cl,x,y,fs,mode,sc){const raw=cl[it.name]||"#c45cff";const color=it.body?mute(raw):raw;const bean=it.body?bodyBean(color):crewBean(color,!!it.ghost);const tagX=mode==="right"?x+18:x;const tagY=mode==="right"?y+4:y+22;const you=!it.body&&it.self?`<text x="0" y="-18" text-anchor="middle" font-size="9" font-weight="700" fill="#8a5a10" stroke="#fff6e4" stroke-width="2.4" paint-order="stroke" font-family="system-ui,sans-serif">tú</text>`:"";const ring=!it.body&&it.self?`<ellipse cx="0" cy="13" rx="12" ry="3.4" fill="none" stroke="#e2a20e" stroke-width="1.5"/>`:"";return`<g transform="translate(${x.toFixed(1)},${y.toFixed(1)})" pointer-events="none">${ring}<g transform="scale(${sc})">${bean}</g>${you}</g>${nameTag(tagX,tagY,it.name,fs,mode==="right"?"start":"middle",it.body?"cuerpo":"")}`}
function occupants(room,M){if(!M||M.room!==room)return[];const list=[{name:M.name,self:true,ghost:!M.alive}];for(const n of M.here||[])list.push({name:n});for(const n of M.bodies||[])list.push({name:n,body:true});return list}
function drawPeople(r,items,cl){if(!items.length)return"";const maxLen=Math.max(...items.map(it=>it.name.length));const avail=r.w-14;const slot=avail/items.length;const fsFit=slot/Math.max(1,maxLen*0.58);const tall=r.h>=118;const top=r.y+(r.name==="Cuarto de máquinas"||r.name==="Caldera de espresso"?46:34);const bot=r.y+r.h-6;if(fsFit>=8){const fs=Math.min(tall?15:12,fsFit);const sc=tall?1.28:1.02;const y=bot-30;return items.map((it,i)=>figure(it,cl,r.x+7+slot*(i+.5),y,fs,"mid",sc)).join("")}const n=items.length;const row=Math.min(30,(bot-top)/n);const sc=Math.min(1.05,row/28);const fs=Math.min(13,Math.max(9,row*0.46));return items.map((it,i)=>figure(it,cl,r.x+18,top+row*(i+.5),fs,"right",sc)).join("")}
function furniture(r){const{x,y,w,name}=r;const two=name==="Cuarto de máquinas"||name==="Caldera de espresso";const fy=y+(two?44:30);const cx=x+w/2;if(name==="Barra"){const cups=[];for(let i=0;i<6;i++)cups.push(`<g transform="translate(${x+58+i*58},${fy+8})"><circle r="3.3" fill="#fffaf3" stroke="#5c4033" stroke-width=".8"/><path d="M3.1.2h2.2a1.6 1.6 0 0 1 0 3.2H3.1" fill="none" stroke="#5c4033" stroke-width=".7"/></g>`);return`<g pointer-events="none"><rect x="${x+24}" y="${fy+6}" width="${w-48}" height="11" rx="3" fill="#7a4e32"/><rect x="${x+24}" y="${fy+14}" width="${w-48}" height="5" fill="#c9a36a"/>${cups.join("")}</g>`}if(name==="Tostadora")return`<g pointer-events="none" transform="translate(${cx-18},${fy})"><rect width="36" height="22" rx="3" fill="#5c4033"/><rect x="5" y="4" width="10" height="12" rx="1.5" fill="#2a211c"/><rect x="20" y="4" width="10" height="12" rx="1.5" fill="#2a211c"/><circle cx="30" cy="18" r="1.7" fill="#e6b15a"/></g>`;if(name==="Caja")return`<g pointer-events="none" transform="translate(${cx-16},${fy})"><rect width="32" height="20" rx="2" fill="#6b4e38"/><rect x="4" y="3" width="24" height="8" rx="1" fill="#d7efe4"/><rect x="6" y="14" width="20" height="3" rx="1" fill="#c9a36a"/></g>`;if(name==="Bodega de granos")return[0,1,2,3].map(i=>`<g pointer-events="none" transform="translate(${x+54+i*90},${fy-2})"><ellipse cx="14" cy="16" rx="13" ry="12" fill="#d7a86a" stroke="#6b4e38"/><path d="M6 10c2-8 14-8 16 0" fill="#c49255" stroke="#6b4e38" stroke-width="1"/><ellipse cx="14" cy="10" rx="3.2" ry="1.6" fill="#6b4e38"/></g>`).join("");if(name==="Cuarto de máquinas")return`<g pointer-events="none" transform="translate(${x+12},${y+38})"><rect width="36" height="18" rx="2" fill="#5a5148" stroke="#3a322c"/><path d="M4 13C10 5 14 13 19 6s10 5 13-2" fill="none" stroke="#e6b15a" stroke-width="1.3"/><circle cx="7" cy="5" r="1.6" fill="#e0435a"/><circle cx="14" cy="5" r="1.6" fill="#5fe08a"/></g>`;if(name==="Cámaras")return`<g pointer-events="none" transform="translate(${cx-26},${fy})"><rect width="22" height="14" rx="1.5" fill="#2c3338"/><rect x="28" width="22" height="14" rx="1.5" fill="#2c3338"/><rect x="3" y="3" width="16" height="8" fill="#8fd0c8"/><rect x="31" y="3" width="16" height="8" fill="#8fd0c8"/><path d="M11 14v5M39 14v5M6 19h38" stroke="#5c4033" stroke-width="1.2"/></g>`;if(name==="Terraza")return`<g pointer-events="none"><circle cx="${cx}" cy="${fy+12}" r="11" fill="#c4a06a" stroke="#6b4e38"/><circle cx="${cx}" cy="${fy+12}" r="3.5" fill="#f4eadc"/><circle cx="${cx-20}" cy="${fy+14}" r="4.5" fill="#6b4e38"/><circle cx="${cx+20}" cy="${fy+14}" r="4.5" fill="#6b4e38"/><rect x="${x+22}" y="${fy+6}" width="7" height="14" rx="2" fill="#7a4e32"/><circle cx="${x+25.5}" cy="${fy+2}" r="7" fill="#6a8f4e"/></g>`;if(name==="Cocina")return`<g pointer-events="none" transform="translate(${cx-22},${fy})"><rect width="44" height="24" rx="3" fill="#6b4e38"/><circle cx="13" cy="10" r="5" fill="none" stroke="#2a211c" stroke-width="1.4"/><circle cx="31" cy="10" r="5" fill="none" stroke="#2a211c" stroke-width="1.4"/><circle cx="13" cy="10" r="1.4" fill="#e6b15a"/><circle cx="31" cy="10" r="1.4" fill="#e6b15a"/><rect x="8" y="18" width="28" height="3" rx="1" fill="#c9a36a"/></g>`;if(name==="Molinos")return`<g pointer-events="none" transform="translate(${cx},${fy+12})"><circle cx="-14" r="11" fill="#e6d3b4" stroke="#6b4e38" stroke-width="1.3"/><circle cx="-14" r="2.4" fill="#6b4e38"/><circle cx="14" r="11" fill="#e6d3b4" stroke="#6b4e38" stroke-width="1.3"/><circle cx="14" r="2.4" fill="#6b4e38"/></g>`;return`<g pointer-events="none" transform="translate(${cx-14},${fy})"><rect x="4" y="8" width="20" height="16" rx="7" fill="#b87333" stroke="#6b4e38"/><rect x="8" y="4" width="12" height="6" rx="1" fill="#8d5a3a"/><path d="M10 4C10-1 15-1 15 4M17 3c2-4 6-2 3 2" fill="none" stroke="#fffaf3" stroke-width="1.1"/></g>`}
function roomLabel(r){const lines=r.name==="Cuarto de máquinas"?["Cuarto de","máquinas"]:r.name==="Caldera de espresso"?["Caldera de","espresso"]:[r.name];const fs=r.w>300?17:14;const cx=r.x+r.w/2,start=r.y+18;return lines.map((ln,i)=>`<text x="${cx}" y="${start+i*(fs-1)}" text-anchor="middle" font-size="${fs}" font-weight="700" fill="#3f2a1c" stroke="#fbf6ee" stroke-width="3" paint-order="stroke" font-family="system-ui,sans-serif">${esc(ln)}</text>`).join("")}
function taskBadge(r){return`<g pointer-events="none" transform="translate(${r.x+r.w-20},${r.y+5})"><title>Tarea pendiente</title><rect width="14" height="16" rx="2" fill="#fffaf3" stroke="#5c4033"/><rect x="3.5" y="-1.5" width="7" height="4" rx="1" fill="#e7d3b0" stroke="#5c4033" stroke-width=".8"/><path d="M3 7h8M3 10h8M3 13h5" stroke="#1f9d4a" stroke-width="1.1"/></g>`}
function grate(x,y,hot){return`<g class="${hot?"venthot":"vent"}" transform="translate(${x},${y})" ${hot?`data-vent="1"`:""} pointer-events="${hot?"all":"none"}"><title>${hot?"Usar ventila":"Ventila"}</title>${hot?`<rect class="ring" x="-6" y="-6" width="42" height="32" rx="7" fill="#f0b429" fill-opacity=".22" stroke="#e2a20e" stroke-width="2"/>`:""}<rect width="30" height="20" rx="3" fill="#3e3128" stroke="#c4a574" stroke-width="1.4"/><path d="M3 5h24M3 10h24M3 15h24" stroke="#f0e2d0" stroke-width="1.6"/></g>`}
function legend(){const bean=crewBean("#e0435a",false);const dead=bodyBean("#b7aea6");return`<g transform="translate(14,698)" font-family="system-ui,sans-serif" font-size="12" fill="#5c4033"><rect width="952" height="30" rx="10" fill="#fffaf3" stroke="#e0d0b8"/><text x="14" y="20" font-weight="800" fill="#4a3428">Plano</text><rect x="78" y="9" width="16" height="12" rx="3" fill="#fff6d2" stroke="#f0b429" stroke-width="3"/><text x="100" y="20">Tu sala</text><rect x="175" y="9" width="16" height="12" rx="3" fill="#fbf3e4" stroke="#1f9d4a" stroke-width="3"/><text x="197" y="20">Puedes entrar</text><g transform="translate(330,7)">${grate(0,0,false)}</g><text x="360" y="20">Ventila</text><g transform="translate(430,6)">${taskBadge({x:0,y:0,w:20})}</g><text x="454" y="20">Tarea</text><g transform="translate(530,16) scale(.62)">${bean}</g><text x="552" y="20">Jugador</text><g transform="translate(650,15) scale(.55)">${dead}</g><text x="674" y="20">Cuerpo</text></g>`}
function drawMap(cl){const M=S.me;const here=M&&M.room;const exits=new Set(M&&S.phase==="play"?M.exits:[]);const tasks=new Set(M&&M.tasks||[]);const canVent=!!(M&&M.alive&&M.vent&&S.phase==="play");if(S.map)for(const k of Object.keys(S.map))if(!ROOM[k])console.warn("Sala sin dibujar",k);const p=[];p.push(`<svg class="plano" viewBox="0 0 980 736" role="img" aria-label="Plano de la cafetería"><defs><linearGradient id="wallg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a5b48"/><stop offset="1" stop-color="#5a3f32"/></linearGradient><pattern id="plank" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#f7efe2"/><path d="M0 13.5H14" stroke="#e5d3b6" stroke-width="1"/></pattern><filter id="you" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="0" stdDeviation="3.2" flood-color="#f0b429" flood-opacity=".9"/></filter></defs><rect width="980" height="736" fill="#f4eadc"/><rect x="10" y="6" width="960" height="684" rx="20" fill="url(#wallg)"/>`);for(const[name]of ROOM_LIST){const r=ROOM[name];const fill=name===here?"#fff6d2":FLOOR[name];p.push(`<rect data-room="${esc(name)}" x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="12" fill="${fill}" stroke="#5c4033" stroke-width="2"/>`);if(name===here)p.push(`<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="12" fill="none" stroke="#f0b429" stroke-width="4" filter="url(#you)"/>`);else if(exits.has(name))p.push(`<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="12" fill="none" stroke="#1f9d4a" stroke-width="4"/>`)}for(const[x,y,w,h]of HALLS)p.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#plank)"/>`);p.push(`<g pointer-events="none">`);for(const l of HALL_LABELS){const tr=l.rot?` transform="rotate(${l.rot} ${l.x} ${l.y})"`:"";p.push(`<text x="${l.x}" y="${l.y}"${tr} text-anchor="middle" font-size="10" font-weight="700" fill="#6a4e3c" letter-spacing="1.5" font-family="system-ui,sans-serif">${l.t}</text>`)}p.push(`</g>`);for(const[name]of ROOM_LIST){const r=ROOM[name];p.push(`<g pointer-events="none">${furniture(r)}${roomLabel(r)}${tasks.has(name)?taskBadge(r):""}${drawPeople(r,occupants(name,M),cl)}</g>`)}for(const v of VENT_LINKS){const hot=canVent&&((here===v.a&&M.vent===v.b)||(here===v.b&&M.vent===v.a));p.push(`<g pointer-events="none"><line x1="${v.x1}" y1="${v.y1}" x2="${v.x2}" y2="${v.y2}" stroke="#2a211c" stroke-width="7" stroke-dasharray="2 5" stroke-linecap="round"/><line x1="${v.x1}" y1="${v.y1}" x2="${v.x2}" y2="${v.y2}" stroke="#eadcc8" stroke-width="3.5" stroke-dasharray="1 6" stroke-linecap="round"/><text x="${v.lx}" y="${v.ly}" font-size="9" font-weight="700" fill="#f6ebdd" stroke="#2a211c" stroke-width="2" paint-order="stroke" font-family="system-ui,sans-serif">ventila</text></g>`);p.push(grate(v.ga[0],v.ga[1],hot));p.push(grate(v.gb[0],v.gb[1],hot))}for(const[name]of ROOM_LIST){const r=ROOM[name];const can=exits.has(name);p.push(`<rect class="hit${can?" can":""}" ${can?`data-move="${esc(name)}"`:""} x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="12" fill="transparent"><title>${esc(name)}${can?". Puedes entrar.":""}</title></rect>`)}for(const v of VENT_LINKS){const hot=canVent&&((here===v.a&&M.vent===v.b)||(here===v.b&&M.vent===v.a));if(hot){p.push(grate(v.ga[0],v.ga[1],true));p.push(grate(v.gb[0],v.gb[1],true))}}p.push(legend());p.push(`</svg>`);const root=document.getElementById("map");root.innerHTML=p.join("");root.querySelectorAll("[data-move]").forEach(el=>{el.addEventListener("click",()=>post({action:"move",target:el.getAttribute("data-move")}))});root.querySelectorAll("[data-vent]").forEach(el=>{el.addEventListener("click",ev=>{ev.stopPropagation();post({action:"vent"})})})}
function draw(){const M=S.me;const cl={};S.players.forEach((p,i)=>cl[p.name]=COL[i%10]);drawMap(cl);
const[dn,t]=S.progress;document.getElementById("prog").style.width=(t?dn/t*100:0)+"%";
document.getElementById("log").innerHTML=S.log.map(x=>`<div>${x}</div>`).join("");document.getElementById("log").scrollTop=1e9;
let h="";if(!M){h=`<b>Únete</b><br><input id=n placeholder="Tu nombre"><button onclick="post({action:'join',name:n.value})">Entrar</button>`}
else{h=`<div>Hola <b style="color:${cl[M.name]}">${M.name}</b> ${M.alive?"":"👻"}</div>`;
if(S.phase=="lobby")h+=`<p>Jugadores: ${S.players.map(p=>p.name).join(", ")}</p><button onclick="post({action:'start'})">Empezar partida</button>`;
else{h+=`<div class=big style="color:${M.role=="impostor"?"#e0435a":"#5fe08a"}">${M.role=="impostor"?"🔪 IMPOSTOR":"🧑‍🚀 TRIPULANTE"}</div><div>Estás en <b>${M.room}</b></div>`;
if(M.role=="tripulante")h+=`<div>Tareas: ${M.tasks.join(", ")||"¡listas!"}</div>`;
if(S.phase=="play"){if(M.tasks.includes(M.room)||M.role=="impostor")h+=`<button onclick="post({action:'task'})">Hacer tarea</button>`;
if(M.alive){if(M.role=="impostor")M.here.forEach(n=>h+=`<button class=red onclick="post({action:'kill',target:'${n}'})">Matar a ${n}</button>`)+(M.cd?`<div>Enfriamiento: ${M.cd}</div>`:"");
if(M.bodies.length)h+=`<button class=red onclick="post({action:'report'})">Reportar cuerpo</button>`;h+=`<button class=gray onclick="post({action:'meeting'})">🚨 Emergencia</button>`}
h+=`<p style="font-size:12px">Haz clic en una sala con borde verde para moverte.</p>`}
if(S.phase=="meeting"){h+=`<h3>🗳️ Reunión</h3><input id=c placeholder="Di algo"><button onclick="post({action:'chat',text:c.value})">Hablar</button><br>`;
if(M.alive)S.players.filter(p=>p.alive).forEach(p=>h+=`<button onclick="post({action:'vote',target:'${p.name}'})">${p.name}${p.voted?" ✔":""}</button>`)+(h+=`<button class=gray onclick="post({action:'vote',target:'skip'})">Saltar</button>`)}
if(S.phase=="end")h+=`<div class=big>${S.winner}</div>`}
h+=`<p><button class=gray onclick="if(confirm('¿Reiniciar la partida para todos?')){localStorage.ib='{}';me={};post({action:'reset'})}">Nueva partida</button></p>`}
document.getElementById("panel").innerHTML=h}
poll();setInterval(()=>{if(!document.activeElement||document.activeElement.tagName!="INPUT")poll()},2000);
</script></html>
